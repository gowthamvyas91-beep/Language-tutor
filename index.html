<!DOCTYPE html>
<html>
<head>

  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; padding: 10px; display: flex; flex-direction: column; height: 100vh; background: #fafafa; }
    .bar { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }

    .padbar { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }

    details { margin: 4px 0 10px; }

    #micBanner { display: none; align-items: center; gap: 8px; flex-wrap: wrap; background: #fff8e1;

    .pcard { background: #fff; border-radius: 14px; padding: 14px; max-width: 560px; margin: 0 auto 20px; box-shadow: 0 6px 24px rgba(0,0,0,.2); }

    .pcard h4 { margin: 14px 0 6px; font-size: 14px; }
    .cheer { background: #fff8e1; border-radius: 10px; padding: 8px 10px; margin: 10px 0; font-size: 14px; }
    .goalbox { display: flex; gap: 12px; align-items: center; border: 1px solid #e0e0e0; border-radius: 12px; padding: 10px; }
    .goalbox.empty { background: #e8f0fe; border-color: #c6dafc; }
    .ring { width: 84px; height: 84px; flex: 0 0 84px; }
    .gtext { flex: 1; min-width: 0; }
    .gname { font-weight: 700; font-size: 15px; }
    .gmsg { font-size: 14px; margin: 6px 0 4px; }
    .pill { display: inline-block; border-radius: 12px; padding: 2px 10px; font-size: 12px; font-weight: 600; margin-top: 6px; }
    .dots { display: flex; gap: 6px; justify-content: space-between; }

    .dot.some span { background: #c8e6c9; }
    .dot.on span { background: #34a853; }
    .dot small { font-size: 11px; color: #777; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 12px 0 6px; text-align: center; }
    .stats b { display: block; font-size: 17px; }

    .stats small { font-size: 11px; color: #666; }
    @media (max-width: 420px) { .stats { grid-template-columns: repeat(2, 1fr); } }
    .trow { display: flex; justify-content: space-between; font-size: 14px; padding: 4px 0; border-top: 1px solid #f1f3f4; }
    .pbtns { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

    .pbtns .secondary { flex: 1; }
    .gtypes { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
    .pitem { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; border-top: 1px solid #f1f3f4; font-size: 14px; }
    .pitem input { margin-top: 3px; width: 18px; height: 18px; flex: 0 0 18px; }
    .pitem input:checked + span b { text-decoration: line-through; color: #777; }
    .mitem { padding: 6px 0; border-top: 1px solid #f1f3f4; font-size: 14px; }
    .mitem a { font-size: 12px; color: #1a73e8; }
    body.pinyin .composer, body.pinyin .subbar, body.pinyin #phases { display: none !important; }
    .pyhead { display: flex; justify-content: space-between; align-items: center; }
    .pyword { font-size: 52px; text-align: center; margin: 14px 0 2px; letter-spacing: 4px; }
    .pypy { font-size: 22px; text-align: center; color: #1a4fb0; margin-bottom: 2px; }
    .pytip { background: #e8f0fe; border-radius: 8px; padding: 8px 10px; margin: 8px 0; font-size: 14px; }
    .pybtns { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .pybtns .go { flex: 2; padding: 14px; border-radius: 10px; font-size: 17px; }
    .pybtns .secondary { flex: 1; }
    .sylrow { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin: 10px 0 4px; }
    .syl { border-radius: 10px; padding: 6px 10px; text-align: center; min-width: 58px; border: 2px solid; }
    .syl .h { font-size: 22px; } .syl .p { font-size: 15px; font-weight: 600; } .syl .n { font-size: 11px; }
    .syl.ok { border-color: #34a853; background: #e6f4ea; } .syl.tone { border-color: #f9ab00; background: #fef7e0; } .syl.bad { border-color: #ea4335; background: #fce8e6; }
    .pitchbox { margin-top: 6px; }
    .pronwrap { display: flex; justify-content: flex-end; margin: -2px 0 6px; }
    .pron { max-width: 92%; background: #fff; border: 1px solid #e0e0e0; border-radius: 10px; padding: 6px 10px; font-size: 14px; line-height: 1.9; }
    .pw { border-radius: 6px; padding: 1px 5px; margin: 0 1px; display: inline-block; line-height: 1.3; text-align: center; }
    .pw small { display: block; font-size: 11px; }
    .pw.ok { background: #e6f4ea; color: #137333; } .pw.tone { background: #fef7e0; color: #b06000; } .pw.bad { background: #fce8e6; color: #c5221f; font-weight: 600; }
    #pitchStrip { width: 100%; height: 56px; display: block; background: #fcfcfc; border: 1px solid #eee; border-radius: 8px; }
    #pitchCap { min-height: 14px; margin: 2px 4px 0; }
    #pitchBtn.on { background: #e8f0fe; color: #1a4fb0; }
    .pitchcv { width: 100%; height: 150px; display: block; background: #fcfcfc; border: 1px solid #eee; border-radius: 10px; margin-top: 10px; }
    .pylive { font-size: 15px !important; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 13px; color: #555; margin-top: 4px; min-height: 18px; }
    .pybtns .go.rec { background: #d93025; animation: pulse 1s infinite; }
    .pyverdict { text-align: center; font-size: 18px; font-weight: 700; margin: 6px 0 2px; }
    .pyverdict.good { color: #137333; }
    .pyb { display: grid; grid-template-columns: 90px 1fr 44px; gap: 8px; align-items: center; font-size: 13px; }
    .pyb .bar100 { margin: 0; }
.fcnav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .fcnav .pill:disabled { opacity: .4; }
    .fcword { font-size: 40px; text-align: center; margin: 18px 0 6px; font-weight: 500; word-break: break-word; }
    .fcread { font-size: 20px; text-align: center; color: var(--blue-d); }
    .fcmean { font-size: 19px; text-align: center; margin: 10px 0; line-height: 1.4; }
    .fcback { border-top: 1px dashed var(--line); margin-top: 10px; padding-top: 6px; }
    .fcnew { background: #e6f4ea; color: #137333; border-radius: 8px; padding: 1px 6px; font-size: 11px; }
    .grade { flex: 1 1 0; border-radius: 12px; padding: 10px 4px; font-size: 15px; font-weight: 600; display: flex; flex-direction: column; align-items: center; }
    .grade small { font-weight: 400; font-size: 11px; opacity: .85; }
    .grade.again { background: #d93025; } .grade.hard { background: #f29900; } .grade.good { background: #188038; } .grade.easy { background: #1a73e8; }
    .fcstats { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; gap: 6px; margin: 10px 0; }
    .fcstats b { display: block; font-size: 22px; } .fcstats small { font-size: 12px; color: var(--ink2); }
    .seg { display: flex; gap: 6px; margin: 6px 0 10px; flex-wrap: wrap; }
    .seg button { flex: 1 1 140px; background: #f1f3f4; color: var(--ink); border-radius: 12px; font-size: 13px; padding: 8px; }
    .seg button.on { background: var(--blue-l); color: var(--blue-d); box-shadow: inset 0 0 0 1.5px var(--blue); }
    .fcdel { background: none; color: var(--ink2); padding: 0 4px; font-size: 14px; }
    .fcmap { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 6px 0; }
    .fcmap label { font-size: 12px; color: var(--ink2); display: flex; flex-direction: column; gap: 3px; }
    .fcmap select { font-size: 14px; padding: 6px; border-radius: 8px; border: 1px solid var(--line); }
    .fcprev { width: 100%; border-collapse: collapse; font-size: 13px; margin: 4px 0 6px; table-layout: fixed; }
    .fcprev td, .fcprev th { border: 1px solid #eee; padding: 4px 6px; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fcprev th { background: #f8f9fa; font-weight: 600; }
#todayBar { display: none; margin: 6px 12px 0; background: var(--blue-l); border-radius: 12px; padding: 6px 8px 6px 12px; font-size: 13px; color: var(--blue-d);
      display: flex; justify-content: space-between; align-items: center; gap: 8px; flex: 0 0 auto; }
    #todayBar .pill { padding: 4px 10px; font-size: 13px; margin-left: 4px; }
    .steps { margin: 12px 0; }
    .step { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid #f1f3f4; }
    .step .dot { flex: 0 0 28px; height: 28px; border-radius: 50%; background: var(--blue-l); color: var(--blue-d); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; }
    .step.done .dot { background: #e6f4ea; color: #137333; }
    .step.done b { color: var(--ink2); text-decoration: line-through; }
    .msg.cele { background: linear-gradient(135deg, #fff8e1, #e6f4ea); border: 1px solid #f9d77e; font-weight: 600; max-width: 100%; }
    #toast { position: fixed; left: 50%; bottom: 90px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; z-index: 60;
      background: #202124; color: #fff; border-radius: 12px; padding: 10px 16px; font-size: 14px; max-width: 92vw; text-align: center;
      transition: opacity .3s, transform .3s; box-shadow: 0 6px 20px rgba(0,0,0,.3); }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    #toast.big { font-size: 16px; padding: 14px 20px; background: #137333; }
    #pitchModeBar { background: #fef7e0; border: 1px solid #f9d77e; border-radius: 8px; padding: 6px 8px; font-size: 13px; margin-top: 4px; }
    #pitchModeBar button { padding: 4px 10px; font-size: 13px; margin-left: 4px; }
    .mtlink { font-size: 12px; color: #1a73e8; text-decoration: none; margin: 0 6px; white-space: nowrap; }
    .mt div { padding: 6px 0; border-bottom: 1px solid #f1f3f4; font-size: 14px; line-height: 1.45; }

    /* ================= Design layer (clean, Google-Translate-like) ================= */
    :root { --blue: #1a73e8; --blue-d: #174ea6; --blue-l: #e8f0fe; --ink: #202124; --ink2: #5f6368; --line: #dadce0; --bg: #f8f9fa; --card: #fff; }
    html, body { height: 100%; }
    body { font-family: "Google Sans", Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink);
      padding: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    select, button, textarea { font-family: inherit; }
    button { background: var(--blue); }
    button.secondary { background: #f1f3f4; color: var(--ink); }

    .appbar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--card); border-bottom: 1px solid var(--line); flex: 0 0 auto; }
    .brand { font-weight: 600; font-size: 18px; color: var(--ink2); white-space: nowrap; }
    .grow { flex: 1; }
    .langchip { border: 1px solid var(--line); background: var(--blue-l); color: var(--blue-d); font-weight: 600; border-radius: 20px; padding: 8px 14px;
      font-size: 15px; max-width: 60vw; appearance: none; -webkit-appearance: none; cursor: pointer; }
    button.icon { background: transparent; color: var(--ink2); border: none; font-size: 20px; padding: 6px 8px; border-radius: 50%; min-width: 40px; }
    button.icon:hover { background: #f1f3f4; }

    .tabs { display: flex; gap: 4px; padding: 0 8px; background: var(--card); border-bottom: 1px solid var(--line); overflow-x: auto; flex: 0 0 auto;
      scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { background: none; color: var(--ink2); border: none; border-bottom: 3px solid transparent; border-radius: 0; padding: 10px 12px 8px;
      font-size: 14px; font-weight: 500; white-space: nowrap; flex: 0 0 auto; }
    .tab.on { color: var(--blue); border-bottom-color: var(--blue); }

    .subbar { display: flex; align-items: center; gap: 6px; padding: 8px 12px; overflow-x: auto; flex: 0 0 auto; scrollbar-width: none; }
    .subbar::-webkit-scrollbar { display: none; }
    .pill { flex: 0 0 auto; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 18px; padding: 6px 12px; font-size: 14px; }
    .pill.primary { background: var(--blue); color: #fff; border-color: var(--blue); }

    #sheetBg { display: none; position: fixed; inset: 0; background: rgba(32,33,36,.4); z-index: 70; }
    #sheet { position: fixed; top: 0; right: 0; bottom: 0; width: min(340px, 88vw); background: var(--card); z-index: 71; transform: translateX(105%);
      transition: transform .2s; box-shadow: -4px 0 20px rgba(0,0,0,.2); padding: 12px 16px; overflow-y: auto; }
    body.sheet #sheet { transform: none; }
    body.sheet #sheetBg { display: block; }
    .sheethead { display: flex; justify-content: space-between; align-items: center; font-size: 17px; margin-bottom: 6px; }
    .srow { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f1f3f4; font-size: 14px; }
    .srow select { max-width: 60%; border: 1px solid var(--line); border-radius: 8px; padding: 6px; font-size: 14px; background: #fff; }
    .toggle { background: #f1f3f4; color: var(--ink); border: none; border-radius: 16px; padding: 6px 12px; font-size: 14px; }
    #pitchBtn.on { background: var(--blue-l); color: var(--blue-d); }
    .sheethint { font-size: 12px; color: var(--ink2); margin-top: 10px; line-height: 1.5; }
    .sheetwho { margin: 4px 0 6px; }

    #micBanner { margin: 8px 12px 0; flex: 0 0 auto; }
    #phases { margin: 4px 12px 0; flex: 0 0 auto; }
    .ph { font-size: 10px; }
    #log { flex: 1 1 auto; overflow-y: auto; padding: 8px 12px 12px; -webkit-overflow-scrolling: touch; }

    .msg { max-width: 88%; margin: 10px 0; padding: 12px 14px; border-radius: 18px; line-height: 1.55; font-size: 16px; white-space: pre-wrap; word-wrap: break-word; }
    .tutor { background: var(--card); border: 1px solid var(--line); border-radius: 4px 18px 18px 18px; box-shadow: 0 1px 2px rgba(60,64,67,.08); position: relative; padding-bottom: 34px; }

      box-shadow: 0 2px 6px rgba(26,115,232,.4); display: flex; align-items: center; justify-content: center; }

<script>
  // Phones (Android / iPhone) can't share the microphone between speech recognition and the pitch display,
  // so there the two take turns. Computers run both together.
  var IS_PHONE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent || '');
  if (IS_PHONE) document.documentElement.classList.add('phone');
  // ---------- Backend bridge ----------
  // Works two ways:
  //  • Inside Google (Sheets sidebar / Apps Script web app): uses google.script.run.
  //  • As a normal website (GitHub Pages etc.): calls the Apps Script web app over HTTPS,
  //    which is what lets the microphone work. Asks once for the web app URL and PIN.
  const IN_GOOGLE = !!(window.google && google.script && google.script.run);

  function getConfig() {
    let c = {};
    try { c = JSON.parse(localStorage.getItem('tutorConfig') || '{}'); } catch (e) {}
    if (!c.code && c.pin) c.code = c.pin; // older versions called it a PIN
    return c;
  }

  function saveConfig(c) {
    try { localStorage.setItem('tutorConfig', JSON.stringify({ url: c.url || '', code: c.code || '' })); } catch (e) {}
  }

  // A personal link looks like  …/Language-tutor/?api=<web app URL>&code=ABCD1234
  (function readLinkParams() {
    if (IN_GOOGLE) return;
    const q = new URLSearchParams(location.search);
    if (!q.get('api') && !q.get('code')) return;
    const c = getConfig();
    if (q.get('api')) c.url = q.get('api').trim();
    if (q.get('code')) c.code = q.get('code').trim();
    saveConfig(c);
    try { history.replaceState(null, '', location.pathname); } catch (e) {} // keep the code out of the address bar
  })();

  const NEED_LOGIN = 'NEED_LOGIN';

  // Network failures ("Failed to fetch") are retried once after a short wait; if it still fails,
  // a quick ping tells apart "no internet / wrong link" from "the server had a problem with this request".
  // A page newer than the server: say exactly what to do instead of "Unknown function".
  function oldServer(err) {
    if (err && /Unknown function/i.test(err.message || '')) {
      const e = new Error('The Apps Script server is an older version than this page. In Apps Script: paste the new Code.gs, then Deploy → Manage deployments → ✏️ Edit → Version: New version → Deploy, and run Language Tutor → Set up sheets once.');
      e.oldServer = true;
      throw e;
    }
    throw err;
  }
  function call(fn, ...args) { return call_(fn, args).catch(oldServer); }
  function call_(fn, args) {
    if (IN_GOOGLE) {
      return new Promise((resolve, reject) =>
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).api(fn, args));
    }
    return callOnce(fn, args).catch(err => {
      if (!err || !err.network) throw err;
      return new Promise(r => setTimeout(r, 2000)).then(() => callOnce(fn, args)).catch(err2 => {
        if (!err2 || !err2.network) throw err2;
        return diagnose().then(msg => { throw new Error(msg); });
      });
    });
  }

  function diagnose() {
    const c = getConfig();
    if (!navigator.onLine) return Promise.resolve('Your phone is offline. Reconnect, then tap ↻ Retry.');
    const sep = c.url.indexOf('?') >= 0 ? '&' : '?';
    return fetch(c.url + sep + 'ping=1')
      .then(r => r.text())
      .then(t => {
        let d = null;
        try { d = JSON.parse(t); } catch (e) {}
        if (d && d.ok) return 'The tutor server is up, but this message failed — usually it took too long, or the server was being updated. Tap ↻ Retry.';
        return 'The tutor server link answered with a page instead of data — the newest code may not be deployed yet (Manage deployments → Edit → New version). Then tap ↻ Retry.';
      })
      .catch(() => 'Can\'t reach the tutor server. Check your internet, or tap ⚙ to check the server link, then tap ↻ Retry.');
  }

  function callOnce(fn, args) {
    const c = getConfig();
    if (!c.url || !c.code) return Promise.reject(new Error(NEED_LOGIN));
    return fetch(c.url, {
      method: 'POST',
      // text/plain avoids a CORS pre-flight, which Apps Script can't answer
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ code: c.code, fn: fn, args: args })
    })
      .then(r => r.text().then(t => ({ status: r.status, url: r.url, text: t })))
      .then(r => {
        let d;
        try { d = JSON.parse(r.text); }
        catch (e) { throw new Error(explainBadReply(r, fn)); }
        if (d.code === 'BAD_CODE') {
          const c2 = getConfig(); c2.code = ''; saveConfig(c2);
          showLogin('That access code was not recognised or has been disabled.');
          throw new Error(NEED_LOGIN);
        }
        if (d.error) throw new Error(d.error);
        return d.result;
      }, err => {
        const e = new Error('Could not reach the tutor server (' + err.message + ').');
        e.network = true;
        throw e;
      });
  }

  // Apps Script sent a web page instead of data: say what that page was.
  function explainBadReply(r, fn) {
    const t = r.text || '';
    const title = ((t.match(/<title>([^<]*)<\/title>/i) || [])[1] || '').trim();
    const plain = t.replace(/<script[\s\S]*?<\/script>|<style[\s\S]*?<\/style>/gi, ' ')
      .replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
    const where = ' [' + fn + ', HTTP ' + r.status + ']';
    if (/accounts\.google\.com|ServiceLogin|Sign in/i.test(r.url + ' ' + title + ' ' + plain.slice(0, 300)))
      return 'Google asked for a sign-in, so the deployment is not open to "Anyone" (it may be "Anyone with Google account"), ' +
        'or the URL is an old/test deployment. Deploy → Manage deployments → Edit → Who has access: Anyone → New version → Deploy, then copy that URL into ⚙.' + where;
    if (/Script function not found: doPost/i.test(plain))
      return 'The deployed code has no doPost. Paste the latest Code.gs, then Deploy → Manage deployments → Edit → Version: New version → Deploy.' + where;
    if (/Authori[sz]ation is required|needs your permission|authorize/i.test(plain))
      return 'Apps Script needs permission again. In the editor, pick "setupSheets" and press Run, approve the access, then try again.' + where;
    if (/unable to open the file|Page Not Found|not found/i.test(title + ' ' + plain.slice(0, 200)))
      return 'That web app URL does not exist (the deployment may have been archived). Copy the current Web app URL into ⚙.' + where;
    if (r.status === 429 || /too many|quota|Service invoked/i.test(plain))
      return 'Apps Script hit a daily limit or is busy. Wait a minute and try again.' + where;
    return 'Apps Script sent a page instead of data: "' + (title ? title + ' — ' : '') + plain.slice(0, 160) + '"' + where;
  }

  function showApiError(err) {
    if (err && err.message === NEED_LOGIN) { showLogin(); return; }
    const s = state[lang()];
    s.view.push({ who: 'err', text: 'Connection problem: ' + err.message });
    render();
  }

  // ⚙ = switch learner / change the server link
  function reconnect() {
    showLogin('', true);
  }

  // ---------- Login (access code) ----------

  let loginShown = false;

  function showLogin(message, allowCancel) {
    if (IN_GOOGLE) return;
    loginShown = true;
    const c = getConfig();
    const log = document.getElementById('log');
    log.innerHTML = '';
    const div = document.createElement('div');
    div.className = 'welcome';
    div.innerHTML =
      '<h3>👋 Welcome to the language tutor</h3>' +
      '<div class="sub">Practise a new language by listening and speaking — Spanish, English, Mandarin, German, French, Japanese, Hindi, Telugu and more.</div>' +
      (message ? '<div class="loginerr"></div>' : '') +
      '<label class="lbl">Your access code</label>' +
      '<input id="codeIn" class="txt" autocomplete="off" autocapitalize="characters" placeholder="e.g. K7M2QX9P">' +
      '<details' + (c.url ? '' : ' open') + '><summary class="sub">Tutor server link' + (c.url ? ' (saved)' : '') + '</summary>' +
      '<input id="urlIn" class="txt" placeholder="https://script.google.com/macros/s/…/exec"></details>' +
      '<button class="go" id="loginGo">Start practising</button>' +
      (allowCancel ? '<button class="secondary" id="loginCancel" style="width:100%;margin-top:6px">Cancel</button>' : '') +
      '<div class="sub" style="margin-top:8px">Your progress is saved under your code. Use the same code on any device.</div>';
    log.appendChild(div);
    if (message) div.querySelector('.loginerr').textContent = message;
    div.querySelector('#codeIn').value = c.code || '';
    div.querySelector('#urlIn').value = c.url || '';
    div.querySelector('#loginGo').onclick = () => {
      const code = div.querySelector('#codeIn').value.trim();
      const url = div.querySelector('#urlIn').value.trim();
      if (!code) { div.querySelector('#codeIn').focus(); return; }
      if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) {
        div.querySelector('details').open = true;
        div.querySelector('#urlIn').focus();
        return;
      }
      saveConfig({ url: url, code: code });
      location.reload();
    };
    const cancel = div.querySelector('#loginCancel');
    if (cancel) cancel.onclick = () => { loginShown = false; render(); };
  }
  // Languages come from the server (getLanguages); these are just the starting defaults.
  var LANGS = {
    zh: { code: 'zh', name: 'Mandarin Chinese', flag: '🇨🇳', speech: 'zh-CN', script: true, roman: 'pinyin' },
    es: { code: 'es', name: 'Argentine Spanish', flag: '🇦🇷', speech: 'es-AR' },
    de: { code: 'de', name: 'German', flag: '🇩🇪', speech: 'de-DE' }
  };
  var HELP_LANGS = {}; // code → { name, native, speech }
  var helpLang = 'en';
  const VOICE_FALLBACKS = { 'es-AR': ['es-AR', 'es-US', 'es-419', 'es-MX', 'es'], 'es-MX': ['es-MX', 'es-US', 'es-419', 'es'], 'de-DE': ['de-DE', 'de-AT', 'de-CH', 'de'] };
  function langInfo(l) { return LANGS[l] || { code: l, name: l, flag: '🌐', speech: l }; }
  function speechOf(l) { return langInfo(l).speech || l; }
  function voicePrefs(l) { const s = speechOf(l); return VOICE_FALLBACKS[s] || [s, s.split('-')[0]]; }
  function isScript(l) { return !!langInfo(l).script; }
  function helpSpeech() { return helpLang === 'en' ? 'en-IN' : ((HELP_LANGS[helpLang] || {}).speech || 'en-IN'); }
  const state = new Proxy({}, { get: (t, k) => { if (!(k in t)) t[k] = { messages: [], view: [] }; return t[k]; } });
  let speakOn = true;
  let rateFactor = 1; // lowered by the "Slower" button, reset by "New"
  const levels = new Proxy({}, { get: (t, k) => (k in t ? t[k] : 'beginner') });
  let mode = 'auto';
  let skill = 'guided';
  const PHASES = ['Warm-up', 'Listen', 'Shadow', 'Speak', 'Read', 'Write', 'Wrap-up'];
  const lang = () => document.getElementById('lang').value;

  // ---------- Resume: the session in progress is kept on this device ----------
  // (Level, topic, vocab and reviews are saved on the server; this keeps the conversation itself,
  //  so closing the page or switching language continues where you left off.)
  const KEEP_DAYS = 3;

  function storeKey(l) {
    const who = IN_GOOGLE ? 'owner' : (getConfig().code || 'anon');
    return 'tutorSession_' + who + '_' + l;
  }

  function noImages(msgs) {
    return msgs.map(m => (Array.isArray(m.content) && m.content.some(b => b.type === 'image'))
      ? { role: m.role, content: m.content.filter(b => b.type !== 'image').concat([{ type: 'text', text: '(handwriting image not kept)' }]) }
      : m);
  }

  function saveLocal(l) {
    const s = state[l];
    try {
      if (!s.messages.length) { localStorage.removeItem(storeKey(l)); return; }
      localStorage.setItem(storeKey(l), JSON.stringify({
        savedAt: Date.now(), skill: s.skill || skill, custom: s.custom || '',
        messages: noImages(s.messages),
        view: s.view.filter(v => v.text !== '…').map(v => v.img ? Object.assign({}, v, { img: null, text: v.text || '✏️ Handwriting' }) : v),
        phase: phase[l] || 0, task: testTask[l] || 0, completed: !!completed[l]
      }));
    } catch (e) { /* storage full or blocked: resume just won't be available */ }
  }

  function restoreLocal() {
    const prefix = storeKey('');
    const codes = [];
    try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.indexOf(prefix) === 0) codes.push(k.slice(prefix.length)); } } catch (e) {}
    codes.forEach(l => {
      try {
        const d = JSON.parse(localStorage.getItem(storeKey(l)) || 'null');
        if (!d || !d.messages || !d.messages.length) return;
        if (Date.now() - d.savedAt > KEEP_DAYS * 86400000) { localStorage.removeItem(storeKey(l)); return; }
        state[l] = { messages: d.messages, view: d.view || [], skill: d.skill, custom: d.custom || '', resumedAt: d.savedAt };
        phase[l] = d.phase || 0;
        testTask[l] = d.task || 0;
        completed[l] = !!d.completed;
      } catch (e) {}
    });
  }

  // A resumed session belongs to the skill it was started in.
  function matchSessionSkill() {
    const s = state[lang()];
    if (s && s.messages.length && s.skill && s.skill !== skill) {
      skill = s.skill;
      document.getElementById('skill').value = skill;
      buildSkillUI();
    }
  }

  function rememberLang() { try { localStorage.setItem('tutorLang', lang()); } catch (e) {} }

  // ---------- Per-skill activities and quick replies ----------

  const ACTIVITIES = {
    guided:   [['', "Today's plan"]],
    speaking: [['', 'Any activity'], ['Story asking', '📖 Story'], ['Role-play', '🎭 Role-play'],
               ['Shadowing', '🗣 Shadowing'], ['Picture talk', '🖼 Picture talk'], ['Daily chat', '☕ Daily chat']],
    reading:  [['', 'Any activity'], ['Graded story', '📚 Graded story'], ['Dialogue to read', '💬 Dialogue'],
               ['Real-world text', '🧾 Menu / sign / message'], ['News-lite', '📰 News-lite']],
    writing:  [['', 'Any activity'], ['Dictation', '🎧 Dictation'], ['Sentence building', '🧱 Sentence building'],
               ['Reply to a message', '📱 Reply to a message'], ['Mini diary', '📓 Mini diary'],
               ['Character practice', '字 Character practice', 'script']],
    test:     [['', 'Level test']],
    pinyin:   [['', 'Pinyin']],

  // Pull "[Phase N/7: Name]" off the reply, update the bar, and return the text without it.
  function takePhase(text, l) {
    // the tag can come after a short intro line, so look anywhere; keep the highest phase if there are several
    const re = /\[Phase (\d)\/7:[^\]]*\]/g;
    let m, found = 0;
    while ((m = re.exec(text))) found = Math.max(found, Number(m[1]));
    if (!found) return text;
    phase[l] = found;
    renderPhases();
    return text.replace(/[ \t]*\[Phase \d\/7:[^\]]*\][ \t]*\n?/g, '').replace(/\n{3,}/g, '\n\n').trim();
  }

  function loadSummary(l, then) {

  // One-line strip on the welcome card
  function progressStrip() {
    const s = summary[lang()];
    const d = document.createElement('div');
    d.className = 'pstrip';
    if (!s) { d.textContent = '📈 Loading your progress…'; return d; }
    const bits = [];
    bits.push(s.streak ? '🔥 ' + s.streak + '-day streak' : (s.practisedToday ? '🔥 Day 1!' : '🔥 Start a streak today'));
    if (s.goal) {
      const look = STATUS_LOOK[s.goal.status] || STATUS_LOOK['on-track'];
      bits.push('🎯 ' + s.goal.name + ' ' + s.goal.percent + '%');
      bits.push(look[0]);
      bits.push('⏱ ' + s.minutesWeek + '/' + s.goal.minutesTargetWeek + ' min this week');
    } else bits.push('🎯 Set a goal');
    d.textContent = bits.join(' · ');
    const b = document.createElement('span');
    b.className = 'plink';
    b.textContent = ' 📈 See progress';
    d.appendChild(b);
    d.onclick = showProgress;
    return d;

  function weekDots(s) {
    const L = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
    return '<div class="dots">' + s.week.map(w => {
      const day = L[new Date(w.date + 'T12:00:00').getDay()];
      return '<div class="dot' + (w.practised ? ' on' : w.minutes ? ' some' : '') + '" title="' + w.date + ': ' + w.minutes + ' min, ' + w.sessions + ' sessions">' +
        '<span>' + (w.practised ? '✓' : '') + '</span><small>' + day + '</small></div>';
    }).join('') + '</div>';
  }

  function ring(pct) {
    const r = 34, c = 2 * Math.PI * r, off = c * (1 - Math.min(100, pct) / 100);
    return '<svg class="ring" viewBox="0 0 84 84"><circle cx="42" cy="42" r="' + r + '" stroke="#eee" stroke-width="9" fill="none"/>' +
      '<circle cx="42" cy="42" r="' + r + '" stroke="#34a853" stroke-width="9" fill="none" stroke-linecap="round" ' +
      'stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '" transform="rotate(-90 42 42)"/>' +
      '<text x="42" y="47" text-anchor="middle" font-size="17" font-weight="700" fill="#202124">' + pct + '%</text></svg>';
  }

  function cheer(s) {
    if (!s.totalSessions && !s.words) return 'Every expert started with one session. Today is a great day for yours. 🌱';
    if (s.practisedToday && s.streak >= 7) return 'A ' + s.streak + '-day streak — this is how people really learn a language. 🔥';
    if (s.practisedToday) return 'You practised today. Your brain is wiring in new words while you sleep. 😴🧠';
    if (s.streak) return 'Keep your ' + s.streak + '-day streak alive — even 10 minutes counts today.';
    return 'Welcome back! One short session gets you moving again.';
  }

  function showProgress() {

    html += '<div class="pbtns"><button class="go" id="pTest">🧪 Take a level test</button>' +

      '<div class="sub" style="margin-top:8px">Minutes are estimated from your replies. A day counts for your streak after 1 finished session or 5 replies.</div>' +
      '<div id="goalForm"></div></div>';
    box.innerHTML = html;

  // The tutor's plan from the last test: exercises to tick off + things to watch and listen to.
  const MEDIA_ICON = { film: '🎬', series: '📺', youtube: '▶️', podcast: '🎧', music: '🎵' };
  function planKey(p) { return 'tutorPlan_' + (getConfig().code || 'owner') + '_' + lang() + '_' + p.date; }
  function planTicks(p) { try { return JSON.parse(localStorage.getItem(planKey(p)) || '{}'); } catch (e) { return {}; } }
  function searchUrl(m) {
    const q = encodeURIComponent(m.title + (m.type === 'film' || m.type === 'series' ? ' watch' : ''));
    return (m.type === 'film' || m.type === 'series') ? 'https://www.google.com/search?q=' + q : 'https://www.youtube.com/results?search_query=' + q;
  }
  function tutorPlanHtml(p) {
    const ticks = planTicks(p);
    let h = '<h4>📋 Your tutor\'s plan <span class="sub">from your test on ' + p.date + '</span></h4>';
    if (p.plan.length) h += '<div class="plan">' + p.plan.map((x, i) =>
      '<label class="pitem"><input type="checkbox" data-i="' + i + '"' + (ticks[i] ? ' checked' : '') + '><span><b>' + escapeHtml(x.what) + '</b>' +
      (x.minutes ? ' <span class="sub">· ' + x.minutes + ' min</span>' : '') + (x.how ? '<br><span class="sub">' + escapeHtml(x.how) + '</span>' : '') + '</span></label>').join('') + '</div>';
    if (p.media.length) h += '<h4>🍿 Immerse yourself</h4><div class="media">' + p.media.map(m =>
      '<div class="mitem"><div><b>' + (MEDIA_ICON[m.type] || '⭐') + ' ' + escapeHtml(m.title) + '</b> ' +
      '<a href="' + searchUrl(m) + '" target="_blank" rel="noopener">find it ↗</a></div>' +
      (m.why ? '<div class="sub">Why: ' + escapeHtml(m.why) + '</div>' : '') + (m.how ? '<div class="sub">How: ' + escapeHtml(m.how) + '</div>' : '') + '</div>').join('') +
      '<div class="sub">Suggestions from your tutor — check availability and age ratings where you live.</div></div>';
    return h;
  }
  function wirePlan(box, p) {
    if (!p) return;
    box.querySelectorAll('.pitem input').forEach(c => c.onchange = () => {
      const t = planTicks(p);
      t[c.dataset.i] = c.checked;
      try { localStorage.setItem(planKey(p), JSON.stringify(t)); } catch (e) {}
      const all = p.plan.length && p.plan.every((x, i) => t[i]);
      if (c.checked) toast(all ? '🏆 Every exercise done — time for a retest!' : '✅ Nice — one more step on your journey.', all);

  function pitchCanvas() {

  }
  function drawPitch() {
    const cv = py.cv, it = pyItem();
    if (!cv || !cv.isConnected || !it) return;
    const dpr = window.devicePixelRatio || 1, W = Math.round((cv.clientWidth || 600) * dpr), H = Math.round((cv.clientHeight || 150) * dpr);
    if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
    const g = cv.getContext('2d'); if (!g) return;
    g.clearRect(0, 0, W, H);
    const pad = 14 * dpr, y = v => H - pad - (Math.max(0.5, Math.min(5.5, v)) - 1) / 4 * (H - 2 * pad);
    g.font = (10 * dpr) + 'px system-ui'; g.fillStyle = '#999'; g.strokeStyle = '#eee'; g.lineWidth = dpr;
    [1, 3, 5].forEach(v => { g.beginPath(); g.moveTo(0, y(v)); g.lineTo(W, y(v)); g.stroke(); });
    g.fillText('high', 4 * dpr, y(5) - 3 * dpr); g.fillText('low', 4 * dpr, y(1) + 11 * dpr);

    C.forEach((c, k) => {
      g.strokeStyle = 'rgba(52,168,83,.28)'; g.lineWidth = 16 * dpr; g.lineCap = 'round'; g.lineJoin = 'round';

      g.stroke();
      g.fillStyle = '#137333'; g.fillText(marked(T[k].ch)[0] || '', slot * k + slot / 2 - 8 * dpr, H - 2 * dpr);

        const t0 = utt[0].t, t1 = pitch.utt ? Math.max(utt[utt.length - 1].t, t0 + 900) : utt[utt.length - 1].t;
        g.strokeStyle = pitch.utt ? '#1a73e8' : '#174ea6'; g.lineWidth = 3.5 * dpr; g.lineCap = 'round';
        g.beginPath();
        let prevT = null;
        pts.forEach(p => {
          const x = slot * 0.15 / T.length + (W - slot * 0.3 / T.length) * (p.t - t0) / Math.max(1, t1 - t0);

  // "👂 You're saying: téng (疼)"
  function hearingText(t) {
    const p = (window.pinyinPro && /[\u4e00-\u9fff]/.test(t)) ? marked(t).join(' ') : '';
    return '👂 You\'re saying: ' + (p ? p + '  (' + t + ')' : t);
  }

  // How close your pitch shape is to the target tones: % per syllable (time split evenly across syllables).
  function toneMatch(utt, it) {
    const T = sylls(it.hanzi), C = targetContours(T);
    const pts = smoothLevels(utt, pitchRange());
    if (pts.length < 6 || !T.length) return null;
    const t0 = pts[0].t, span = Math.max(1, pts[pts.length - 1].t - t0);
    const per = T.map((s, k) => {
      const mine = pts.filter(p => (p.t - t0) / span >= k / T.length && (p.t - t0) / span <= (k + 1) / T.length);
      if (mine.length < 2) return { ch: s.ch, pct: 0 };
      const c = C[k];
      // compare shapes after removing each one's average height offset a little (people speak higher/lower)
      const tgt = mine.map((p, i) => { const x = i / (mine.length - 1) * (c.length - 1), j = Math.min(c.length - 2, Math.floor(x)); return c[j] + (c[j + 1] - c[j]) * (x - j); });
      const off = (mine.reduce((a, p) => a + p.v, 0) - tgt.reduce((a, v) => a + v, 0)) / mine.length * 0.5;
      const mad = mine.reduce((a, p, i) => a + Math.abs(p.v - off - tgt[i]), 0) / mine.length;
      return { ch: s.ch, pct: Math.max(0, Math.min(100, Math.round(100 - mad * 45))) };

  }
  function toneMatchText() {

  // ---------- Pitch strip under the chat (all languages, all exercises) ----------

  function toggleStrip() {

  }
  // Phone pitch-only mic: tap to start, tap to stop.
  function phonePitchMic() {

  function showStrip() {

    if (pm) { pm.style.display = IS_PHONE && stripOn && skill !== 'pinyin' ? '' : 'none'; document.getElementById('pitchExit').onclick = toggleStrip; }
    const cap = document.getElementById('pitchCap');
    if (cap && IS_PHONE && stripOn && !pitch.last) cap.textContent = '〰 Pitch mode — tap 🎤 and shadow the tutor\'s sentence. Tap 〰 to answer normally.';
    const b = document.getElementById('pitchBtn'); if (b) { b.classList.toggle('on', stripOn); b.textContent = IS_PHONE ? (stripOn ? '〰 Pitch mode on' : '〰 Pitch mode off') : (stripOn ? '〰 On' : '〰 Off'); }

  function stripCaption() {
    const c = document.getElementById('pitchCap');

    const pts = pitch.last ? smoothLevels(pitch.last, pitchRange()) : [];
    if (pts.length < 4) return;
    const vals = pts.map(p => p.v), range = Math.max.apply(null, vals) - Math.min.apply(null, vals);
    const k = Math.max(1, Math.floor(pts.length / 5));

  function drawStrip() {

    const dpr = window.devicePixelRatio || 1, W = Math.round((cv.clientWidth || 600) * dpr), H = Math.round((cv.clientHeight || 56) * dpr);

      '<div class="pybtns"><button class="go" id="pyGo">▶ Start practice</button><button class="secondary" id="pyCheck">🧪 Pronunciation check (20)</button></div>' +
      (st && st.clear ? '<div class="cheer">🏅 Clear pronunciation badge earned.</div>' : '') +
      '<details' + (st && st.items ? ' open' : '') + '><summary>📊 My sounds</summary>' + statsHtml(st) + '</details>' +
      '<div class="sub">How it is checked: your browser\'s Chinese speech recognition writes down what it heard, and each syllable is compared with the target. ' +
      'It reliably catches wrong sounds and many wrong tones, but it can be lenient (it may guess the word you meant). Use a quiet room and speak at normal volume.</div>';
    div.querySelector('#pyFocus').onchange = e => { py.focus = e.target.value; };
    div.querySelector('#pyGo').onclick = () => pyStart(false);
    div.querySelector('#pyCheck').onclick = () => pyStart(true);
    if (!st) pyLoadStats();

  // ---------- 🃏 Flashcards + Anki deck import ----------
  // An Anki .apkg is a zip with a SQLite database inside. It is opened right here in the browser
  // (JSZip + sql.js, plus fzstd for the newest Anki format); only the word / reading / meaning text is sent to your sheet.
  var fc = { screen: 'start', data: null, queue: [], idx: 0, shown: false, results: [], dir: 'recognize', imp: null, busy: false, again: new Set() };
  try { fc.dir = localStorage.getItem('fcDir') || 'recognize'; } catch (e) {}
  const FC_SEARCH = { zh: 'HSK', 'zh-tw': 'TOCFL', es: 'Spanish frequency', 'es-es': 'Spanish frequency', 'es-mx': 'Mexican Spanish', de: 'German 4000',
    fr: 'French frequency', it: 'Italian frequency', ja: 'JLPT N5', ko: 'TOPIK', ru: 'Russian frequency', 'pt-br': 'Brazilian Portuguese', ar: 'Arabic frequency',
    hi: 'Hindi', en: 'English vocabulary' };

  function loadScript(src) {
    return new Promise((ok, bad) => { const sc = document.createElement('script'); sc.src = src; sc.onload = ok; sc.onerror = () => bad(new Error('Could not load ' + src.split('/').pop() + ' — check your connection.')); document.head.appendChild(sc); });
  }
  function loadAnkiLibs() {
    if (loadAnkiLibs.p) return loadAnkiLibs.p;
    loadAnkiLibs.p = Promise.all([
      window.JSZip ? 0 : loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'),
      window.initSqlJs ? 0 : loadScript('https://cdn.jsdelivr.net/npm/sql.js@1.13.0/dist/sql-wasm.js'),
      window.fzstd ? 0 : loadScript('https://cdn.jsdelivr.net/npm/fzstd@0.1.1/umd/index.js')
    ]).catch(e => { loadAnkiLibs.p = null; throw e; });
    return loadAnkiLibs.p;
  }

  function cleanField(h) {
    const d = document.createElement('div');
    d.innerHTML = String(h || '').replace(/\[sound:[^\]]*\]/g, ' ').replace(/<br\s*\/?>|<\/div>|<\/p>|<\/li>/gi, ' ; ').replace(/<(style|script)[\s\S]*?<\/\1>/gi, '');
    return (d.textContent || '').replace(/\s*;\s*(;\s*)*/g, '; ').replace(/^[;\s]+|[;\s]+$/g, '').replace(/\s+/g, ' ').trim();
  }

  // → { types: [{name, fields:[names], notes:[[f1,f2,…]]}] } sorted by size
  async function readApkg(file) {
    await loadAnkiLibs();
    const zip = await JSZip.loadAsync(file);
    const name = ['collection.anki21b', 'collection.anki21', 'collection.anki2'].find(n => zip.file(n));
    if (!name) throw new Error('This is not an Anki deck (.apkg). Download a deck from AnkiWeb and choose that file.');
    let bytes = await zip.file(name).async('uint8array');
    if (/b$/.test(name)) bytes = fzstd.decompress(bytes);
    const SQL = await initSqlJs({ locateFile: f => 'https://cdn.jsdelivr.net/npm/sql.js@1.13.0/dist/' + f });
    const db = new SQL.Database(bytes);
    const q = sql => { try { const r = db.exec(sql); return r.length ? r[0].values : []; } catch (e) { return []; } };
    const names = {}, tnames = {};
    const models = q('select models from col');
    if (models.length && models[0][0] && models[0][0] !== '{}') {
      try { const m = JSON.parse(models[0][0]); Object.keys(m).forEach(id => { tnames[id] = m[id].name; names[id] = (m[id].flds || []).sort((a, b) => a.ord - b.ord).map(f => f.name); }); } catch (e) {}
    } else {
      q('select ntid, ord, name from fields order by ntid, ord').forEach(r => { (names[r[0]] = names[r[0]] || [])[r[1]] = r[2]; });
      q('select id, name from notetypes').forEach(r => { tnames[r[0]] = r[1]; });
    }
    const by = {};
    q('select mid, flds from notes order by id').forEach(r => {
      const t = by[r[0]] = by[r[0]] || { name: tnames[r[0]] || 'Cards', fields: names[r[0]] || [], notes: [] };
      t.notes.push(String(r[1]).split('\x1f').map(cleanField));
    });
    db.close();
    const types = Object.keys(by).map(k => by[k]).sort((a, b) => b.notes.length - a.notes.length);
    types.forEach(t => { const n = Math.max.apply(null, t.notes.map(x => x.length)); for (let i = 0; i < n; i++) if (!t.fields[i]) t.fields[i] = 'Field ' + (i + 1); });
    if (!types.length || types[0].notes.length === 1 && /update|newer version/i.test(types[0].notes[0].join(' ')))
      throw new Error('This deck uses a newer Anki format the file didn\'t include. In Anki, export it again with “Support older Anki versions” ticked, or try another deck.');
    return { types: types };
  }

  // Guess which columns are the word, its reading and its meaning.
  function guessColumns(t, l) {
    const n = t.fields.length, sample = t.notes.slice(0, 40);
    const share = re => [...Array(n).keys()].map(i => sample.filter(x => re.test(x[i] || '')).length / Math.max(1, sample.length));
    const byName = re => t.fields.findIndex(f => re.test(f));
    const scriptRe = { zh: /[一-鿿]/, 'zh-tw': /[一-鿿]/, ja: /[぀-ヿ一-鿿]/, ko: /[가-힯]/, ar: /[؀-ۿ]/, ur: /[؀-ۿ]/,
      hi: /[ऀ-ॿ]/, mr: /[ऀ-ॿ]/, te: /[ఀ-౿]/, ta: /[஀-௿]/, kn: /[ಀ-೿]/, ml: /[ഀ-ൿ]/, bn: /[ঀ-৿]/, gu: /[઀-૿]/, ru: /[Ѐ-ӿ]/ }[l];
    let w = -1, r = -1, m = -1;
    if (scriptRe) { const s = share(scriptRe); const best = s.indexOf(Math.max.apply(null, s)); if (s[best] > 0.5) w = best; }
    if (w < 0) w = byName(/simplified|hanzi|word|vocab|expression|front|target|term|spanish|german|french|italian|español|deutsch|^(es|de|fr)$/i);
    if (w < 0) w = 0;
    const tone = share(/[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]/);
    r = byName(/pinyin|reading|pronunciation|romaji|kana|romanization|ipa/i);
    if (r < 0 && /^zh/.test(l)) { const b = tone.indexOf(Math.max.apply(null, tone)); if (tone[b] > 0.5 && b !== w) r = b; }
    m = byName(/meaning|english|definition|translation|gloss|back|significado|bedeutung/i);
    if (m < 0 || m === w) m = [...Array(n).keys()].find(i => i !== w && i !== r && sample.some(x => (x[i] || '').length)) ?? -1;
    if (r === w || r === m) r = -1;
    return { w: w, r: r, m: m };
  }

  function fcLoad() {
    const l = lang();
    fc.screen = 'start'; fc.loading = true; renderCards();
    call('getFlashcards', l).then(d => { fc.data = d; fc.loading = false; renderCards(); }).catch(err => { fc.loading = false; fc.error = err.message; renderCards(); });
  }
  function renderCards() { if (skill === 'cards' && !loginShown && !setupShown) render(); }

  function fcSay(text) {
    if (!('speechSynthesis' in window) || !text) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = speechOf(lang());
    const v = pickVoice(lang()); if (v) u.voice = v;
    u.rate = lang() === 'zh' ? 0.75 : 0.85;
    setTimeout(() => speechSynthesis.speak(u), 60);
  }

  // One-shot listening for the "say it" side: stops ~1.3 s after you finish.
  function fcListen(cb) {
    if (!SR) { alert('Speaking answers need speech recognition — use Chrome.'); return; }
    if (fc.rec) { try { fc.rec.stop(); } catch (e) {} return; }
    speechSynthesis.cancel();
    const r = new SR(); fc.rec = r;
    r.lang = speechOf(lang()); r.interimResults = true; r.continuous = true; r.maxAlternatives = 3;
    let fin = [], interim = '', t = null;
    const stopSoon = ms => { clearTimeout(t); t = setTimeout(() => { try { r.stop(); } catch (e) {} }, ms); };
    r.onaudiostart = () => { fc.listening = true; renderCards(); stopSoon(6000); };
    r.onresult = e => { interim = ''; for (let k = e.resultIndex; k < e.results.length; k++) { const x = e.results[k]; if (x.isFinal) { for (let a = 0; a < x.length; a++) fin.push(x[a].transcript); } else interim += x[0].transcript; } stopSoon(1300); };
    r.onerror = e => { if (e.error === 'not-allowed') fc.micError = 'Microphone blocked — allow it for this site.'; };
    r.onend = () => { clearTimeout(t); fc.rec = null; fc.listening = false; const alts = fin.length ? fin : interim ? [interim] : []; if (!alts.length && !fc.micError) fc.micError = 'Didn\'t catch that — tap 🎤 and say it again.'; cb(alts); };
    try { r.start(); } catch (e) { fc.rec = null; }
  }

  function fcCheck(alts, card) {
    const norm = x => String(x).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\p{L}\p{N}]/gu, '');
    const targets = card.w.split(/[;,/、，]| or /).map(norm).filter(Boolean);
    let best = 0, heard = alts[0] || '';
    alts.forEach(a => {
      const h = norm(a);
      targets.forEach(tg => {
        if (!h || !tg) return;
        if (h === tg || h.includes(tg)) { best = 1; heard = a; return; }
        const L = [], n = tg.length, m = h.length; // similarity by longest common subsequence
        for (let i = 0; i <= n; i++) { L[i] = []; for (let j = 0; j <= m; j++) L[i][j] = !i || !j ? 0 : tg[i - 1] === h[j - 1] ? L[i - 1][j - 1] + 1 : Math.max(L[i - 1][j], L[i][j - 1]); }
        const sc = L[n][m] / Math.max(n, m); if (sc > best) { best = sc; heard = a; }
      });
    });
    return { score: best, heard: heard };
  }

  // Next-interval hints for the four buttons (same rule as the server).
  function fcNext(card, q) {
    let reps = card.kind === 'new' ? 0 : card.reps, ivl = card.ivl || 1;
    if (q < 3) return '1d';
    reps += 1;
    const d = reps === 1 ? 1 : reps === 2 ? 3 : Math.round(ivl * (card.ease || 2.5));
    return d >= 30 ? Math.round(d / 30) + 'mo' : d + 'd';
  }

  function fcStart() {
    const cards = (fc.data && fc.data.cards || []).slice();
    // reviews first, then new ones mixed in
    fc.queue = cards; fc.idx = 0; fc.shown = false; fc.results = []; fc.saved = 0; fc.again = new Set(); fc.check = null; fc.micError = ''; fc.hist = []; fc.revisit = null;
    fc.screen = 'study'; renderCards();
    const c = fc.queue[0]; if (c && fc.dir === 'recognize') fcSay(c.w);
  }

  function fcGrade(q) {
    const c = fc.queue[fc.idx], key = c.w + '|' + c.kind;
    const h = { idx: fc.idx, res: fc.results.length, againAdded: false, q: q };
    if (fc.revisit && fc.revisit.ri != null && fc.revisit.ri >= fc.saved) fc.results[fc.revisit.ri].q = q; // changed your answer on a card you went back to
    else if (!fc.again.has(key)) fc.results.push({ w: c.w, r: c.r, m: c.m, kind: c.kind, q: q }); // the first answer is what counts
    if (q < 3 && !fc.again.has(key)) { fc.again.add(key); fc.queue.push(c); h.againAdded = true; } // see it again at the end
    h.resAfter = fc.results.length;
    fc.hist.push(h); fc.revisit = null;
    fc.idx++; fc.shown = false; fc.check = null; fc.micError = '';
    if (fc.results.length - fc.saved >= 15) fcSave(); // save in batches (the last few stay editable with ← Back)
    if (fc.idx >= fc.queue.length) { fcSave(true); return; }
    fcSaveLater();
    renderCards();
    const n = fc.queue[fc.idx]; if (n && fc.dir === 'recognize') fcSay(n.w);
  }

  // ← Back: show the previous card again (answer revealed). If its grade isn't saved yet you can change it.
  function fcBack() {
    const h = fc.hist && fc.hist.pop();
    if (!h) return;
    const c = fc.queue[h.idx];
    if (h.againAdded) { fc.queue.pop(); fc.again.delete(c.w + '|' + c.kind); }
    let ri = null;
    if (h.resAfter > h.res) { ri = h.res; if (ri >= fc.saved) { fc.results.splice(ri, 1); ri = null; } } // unsaved → undo it completely
    fc.idx = h.idx; fc.shown = true; fc.check = null; fc.micError = '';
    fc.revisit = { ri: ri, saved: h.resAfter > h.res && h.res < fc.saved, q: h.q };
    renderCards(); fcSay(c.w);
  }
  // End the session early: save what you did and go back to the menu you came from.
  function fcExit() {
    if (fc.rec) try { fc.rec.abort(); } catch (e) {}
    clearTimeout(fc.saveTimer);
    const done = fc.results.length;
    if (done && fc.results.length > fc.saved) fcSave();
    if (today.run) { todayNext(); return; }
    fc.screen = 'start'; if (done) toast('💾 Saved ' + done + ' cards'); fcLoad();
  }
  function fcSaveLater() { clearTimeout(fc.saveTimer); fc.saveTimer = setTimeout(() => { if (fc.screen === 'study' && fc.results.length > fc.saved) fcSave(); }, 120000); }

  function fcSave(finish) {
    const batch = fc.results.slice(fc.saved);
    fc.saved = fc.results.length;
    const l = lang();
    const p = batch.length ? call('saveFlashcards', l, batch) : Promise.resolve();
    fc.pending = Promise.resolve(fc.pending).then(() => p).catch(err => toast('⚠ Flashcards not saved: ' + err.message, true));
    if (finish) {
      fc.screen = 'done'; renderCards();
      const n = fc.results.length, good = fc.results.filter(x => x.q >= 3).length;
      toast(n ? '🎉 ' + n + ' cards done — ' + Math.round(100 * good / n) + '% remembered!' : 'Done!', true);
      fc.pending.then(() => { loadSummary(l); call('getFlashcards', l).then(d => { fc.data = d; renderCards(); }).catch(() => {}); });
    }
  }

  function fcImportFile(file) {
    if (!file) return;
    fc.imp = { file: file.name, status: 'Opening the deck…' }; fc.screen = 'import'; renderCards();
    readApkg(file).then(d => {
      const t = d.types[0];
      fc.imp = { file: file.name, types: d.types, t: 0, cols: guessColumns(t, lang()), deck: file.name.replace(/\.(apkg|colpkg)$/i, '').replace(/[_-]+/g, ' ').slice(0, 60), limit: 'all' };
      renderCards();
    }).catch(err => { fc.imp = { file: file.name, error: err.message }; renderCards(); });
  }

  async function fcDoImport() {
    const im = fc.imp, t = im.types[im.t], c = im.cols, l = lang();
    let notes = t.notes.map(x => ({ w: x[c.w] || '', r: c.r >= 0 ? x[c.r] || '' : '', m: c.m >= 0 ? x[c.m] || '' : '' })).filter(x => x.w);
    if (im.limit !== 'all') notes = notes.slice(0, Number(im.limit));
    let added = 0, skipped = 0;
    im.status = 'Importing 0 / ' + notes.length + '…'; im.running = true; renderCards();
    try {
      for (let i = 0; i < notes.length; i += 400) {
        const r = await call('importDeck', l, im.deck, notes.slice(i, i + 400));
        added += r.added; skipped += r.skipped;
        im.status = 'Importing ' + Math.min(notes.length, i + 400) + ' / ' + notes.length + '…'; renderCards();
      }
      toast('📥 Imported ' + added + ' cards' + (skipped ? ' (' + skipped + ' duplicates skipped)' : '') + ' into “' + im.deck + '”', true);
      fc.imp = null; fcLoad();
    } catch (err) { im.running = false; im.status = ''; im.error = err.message; renderCards(); }
  }

  // ---------- 🏠 Today: one click runs the day's plan (word cards → guided lesson → tones) ----------
  var today = { run: false, data: null, lang: null, i: 0, loading: false };
  function setSkillDirect(v) {
    skill = v;
    document.getElementById('skill').value = v;
    call('saveSkill', v).catch(() => {});
    buildSkillUI(); renderPhases(); render();
  }
  function loadToday(then) {
    const l = lang();
    today.loading = true; today.lang = l;
    if (skill === 'today') render();
    return call('getDailyPlan', l, levels[l]).then(d => {
      today.data = d; today.loading = false;
      if (d.seeded && d.seeded.added) toast('⭐ Your starter word deck is ready: ' + d.seeded.added + ' useful words', true);
      if (then) then(d); else if (skill === 'today') render();
      showTodayBar();
    }).catch(err => { today.loading = false; today.error = err.message; if (skill === 'today') render(); });
  }
  function todayStart() {
    today.run = true;
    const d = today.data;
    const i = d.steps.findIndex(s => !s.done);
    if (i < 0) { today.run = false; render(); return; }
    goStep(i);
  }
  function goStep(i) {
    const d = today.data, st = d && d.steps[i];
    if (!st) { todayFinish(); return; }
    today.i = i;
    if (st.id === 'cards') {
      setSkillDirect('cards');
      fc.lang = lang(); fc.screen = 'start'; fc.data = null; fc.loading = true; render();
      call('getFlashcards', lang(), true).then(x => { fc.data = x; fc.loading = false; if (x.cards.length) fcStart(); else { st.done = true; goStep(i + 1); } })
        .catch(err => { fc.loading = false; fc.error = err.message; render(); });
    } else if (st.id === 'lesson') {
      setSkillDirect('guided');
      const l = lang(), s = state[l];
      if (!s.messages.length) {
        const p = plan[l];
        if (p && p.custom && p.custom.active) startCustom(p.custom.active); else startSession();
      }
    } else if (st.id === 'pinyin') { setSkillDirect('pinyin'); pyStart(false); }
    else if (st.id === 'test') { startTest(); }
    showTodayBar();
  }
  function todayNext() {
    const d = today.data; if (!d) return;
    d.steps[today.i].done = true;
    const n = d.steps.findIndex((s, k) => k > today.i && !s.done);
    if (n < 0) todayFinish(); else goStep(n);
  }
  function todayFinish() {
    today.run = false;

  // Wrap each word of a tutor message in a <span class="w"> (Chinese/Japanese need a word segmenter).
  function wrapWords(el, l) {
    const seg = (window.Intl && Intl.Segmenter) ? new Intl.Segmenter(speechOf(l), { granularity: 'word' }) : null;
    const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(n => {
      const text = n.nodeValue;
      if (!/\p{L}/u.test(text)) return;
      const frag = document.createDocumentFragment();
      const parts = seg
        ? Array.from(seg.segment(text), s => ({ t: s.segment, w: s.isWordLike && /\p{L}/u.test(s.segment) }))
        : text.split(/([\p{L}\p{M}'’]+)/u).map((t, i) => ({ t: t, w: i % 2 === 1 }));
      parts.forEach(p => {
        if (!p.t) return;
        if (p.w) {
          const s = document.createElement('span');
          s.className = 'w';
          s.textContent = p.t;
          frag.appendChild(s);
        } else frag.appendChild(document.createTextNode(p.t));
      });
      n.parentNode.replaceChild(frag, n);
    });
  }

  function tipEl() {
    let t = document.getElementById('wtip');
    if (!t) {
      t = document.createElement('div');
      t.id = 'wtip';
      document.body.appendChild(t);
    }
    return t;

  function hideTip() {
    clearTimeout(tipTimer);
    tipFor = null;
    const t = document.getElementById('wtip');
    if (t) t.style.display = 'none';
  }

  function showTip(span, userGesture) {
    const l = lang();
    const word = span.textContent.trim();
    if (!word) return;
    tipFor = span;
    const t = tipEl();
    const r = span.getBoundingClientRect();
    t.style.display = 'block';
    t.style.left = Math.max(8, Math.min(window.innerWidth - 268, r.left + window.scrollX)) + 'px';
    t.style.top = (r.bottom + window.scrollY + 6) + 'px';
    const fill = d => {
      if (tipFor !== span) return;
      t.innerHTML = '';
      const h = document.createElement('div');
      h.className = 'tw';
      h.textContent = (d && d.word) || word;
      if (d && d.reading) { const rd = document.createElement('span'); rd.className = 'tr'; rd.textContent = ' ' + d.reading; h.appendChild(rd); }
      t.appendChild(h);
      const m = document.createElement('div');
      m.textContent = !d ? '…' : d.error ? d.error : (d.meaning || 'Already in your language') + (d.type ? ' (' + d.type + ')' : '');
      t.appendChild(m);
      if (d && d.note) { const nt = document.createElement('div'); nt.className = 'tn'; nt.textContent = d.note; t.appendChild(nt); }
      if (d && d.source) {
        const src = document.createElement('div');
        src.className = 'tn';
        src.textContent = { device: '💻 free on-device translation', dictionary: '📖 from the shared dictionary', ai: '✨ AI lookup — saved for next time', none: '' }[d.source] || '';
        if (d.source === 'device') {
          const more = document.createElement('a');
          more.className = 'more';
          more.textContent = ' · more detail';
          more.href = 'javascript:void 0';
          src.appendChild(more);
        }
        t.appendChild(src);
      }
    };
    const key = l + '|' + helpLang + '|' + word.toLowerCase();
    const msg = span.closest('.msg');
    const full = msg ? msg.textContent : word;
    const at = Math.max(0, full.indexOf(word));
    const sentence = full.slice(Math.max(0, at - 120), at + word.length + 120);
    const fromServer = () => {
      fill(null);
      call('lookupWord', l, word, sentence)
        .then(d => { wordCache.set(key, d || { meaning: '' }); fill(d || { meaning: '' }); })
        .catch(err => fill({ error: err.message }));
    };
    t.onclick = e => { if (e.target.classList.contains('more')) { e.stopPropagation(); fromServer(); } };
    if (wordCache.has(key)) { fill(wordCache.get(key)); return; }
    fill(null);
    // Free first: the browser's own on-device translator (recent desktop Chrome). Otherwise the server,
    // which checks the shared dictionary before it ever pays for an AI lookup.
    deviceTranslate(word, l, userGesture).then(tr => {
      if (tipFor !== span) return;
      if (tr && tr.toLowerCase() !== word.toLowerCase()) {
        const d = { word: word, meaning: tr, source: 'device' };
        wordCache.set(key, d);
        fill(d);
      } else fromServer();
    });
  }

  // Chrome's built-in Translator API runs on the device: free and private. Not on most phones yet.
  const translators = {};
  function deviceTranslate(word, l, gesture) {
    try {
      if (!('Translator' in self)) return Promise.resolve(null);
      const src = speechOf(l).split('-')[0];
      const dst = helpLang === 'en' ? 'en' : ((HELP_LANGS[helpLang] || {}).speech || helpLang).split('-')[0];
      if (src === dst) return Promise.resolve(null);
      const pair = src + '>' + dst;
      if (!translators[pair]) {
        translators[pair] = Translator.availability({ sourceLanguage: src, targetLanguage: dst }).then(a => {
          if (a === 'unavailable' || (a !== 'available' && !gesture)) { delete translators[pair]; return null; }
          return Translator.create({ sourceLanguage: src, targetLanguage: dst }); // a tap may download the language pack once
        }).catch(() => { delete translators[pair]; return null; });
      }
      return translators[pair].then(tr => tr ? tr.translate(word) : null).catch(() => null);
    } catch (e) { return Promise.resolve(null); }
  }

      showTip(w, true);

        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(w.textContent);
        u.lang = speechOf(lang());
        const v = pickVoice(lang()); if (v) u.voice = v;
        u.rate = 0.8;
        speechSynthesis.speak(u);
      }
    }, true);
    log.addEventListener('pointerover', e => {
      if (e.pointerType !== 'mouse' || !wordsOn) return;
      const w = e.target.closest && e.target.closest('.msg.tutor .w');
      clearTimeout(tipTimer);
      if (w) tipTimer = setTimeout(() => showTip(w), 350);

    log.addEventListener('pointerout', e => {

  // ---------- Ask the tutor ----------

  function setAsk(on) {
