<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; padding: 10px; display: flex; flex-direction: column; height: 100vh; background: #fafafa; }
    .bar { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
    select, button, textarea { font-size: 15px; border-radius: 8px; border: 1px solid #ccc; padding: 8px; }
    button { background: #1a73e8; color: #fff; border: none; cursor: pointer; }
    button.secondary { background: #e8eaed; color: #222; }
    button:disabled { opacity: .5; }
    #mic { font-size: 20px; padding: 6px 14px; }
    .pause { flex: 0 0 auto; padding: 4px; font-size: 13px; }
    #mic { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    #mic.listening { background: #d93025; animation: pulse 1s infinite; }
    @keyframes pulse { 50% { opacity: .6; } }
    #log { flex: 1; overflow-y: auto; padding: 4px; }
    .msg { margin: 6px 0; padding: 8px 10px; border-radius: 10px; white-space: pre-wrap; line-height: 1.45; max-width: 92%; }
    .me { background: #1a73e8; color: #fff; margin-left: auto; }
    .me img { display: block; max-width: 100%; border-radius: 6px; margin-top: 4px; background: #fff; }
    .tutor { background: #fff; border: 1px solid #e0e0e0; cursor: pointer; }
    body.reading .tutor { font-size: 18px; line-height: 1.7; }
    .err { background: #fde7e7; color: #a00; }
    .hint { font-size: 12px; color: #666; margin: 2px 4px; }
    .meta { font-size: 11px; color: #777; margin: -2px 0 6px 4px; display: flex; gap: 8px; align-items: center; }
    .meta .sonnet { color: #8430ce; font-weight: 600; }
    .redo { background: none; color: #8430ce; border: 1px solid #8430ce; padding: 2px 8px; font-size: 11px; border-radius: 12px; }
    .row { display: flex; gap: 6px; margin-top: 8px; }
    .chips { display: flex; gap: 6px; overflow-x: auto; padding: 6px 0 0; -webkit-overflow-scrolling: touch; }
    .chip { flex: 0 0 auto; background: #e8f0fe; color: #1a4fb0; border: none; border-radius: 16px; padding: 6px 12px; font-size: 13px; }
    .chip.on { background: #fbbc04; color: #222; font-weight: 600; }
    .me.q { background: #f9ab00; color: #222; }
    textarea { flex: 1; resize: none; height: 54px; }
    #pad { display: none; margin-top: 8px; background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 6px; }
    #pad.open { display: block; }
    #canvas { width: 100%; height: 200px; touch-action: none; display: block; border-radius: 6px;
      background: #fff repeating-linear-gradient(0deg, transparent 0 49px, #eee 49px 50px); }
    .padbar { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
    .padbar button { padding: 6px 10px; font-size: 13px; }
    #photo { display: none; }
    #phases { display: none; gap: 3px; margin: 2px 0 6px; }
    #phases.show { display: flex; }
    .ph { flex: 1; text-align: center; font-size: 10px; color: #888; padding-top: 5px; border-top: 4px solid #e0e0e0; }
    .ph.done { border-color: #81c995; color: #34a853; }
    .ph.now { border-color: #1a73e8; color: #1a73e8; font-weight: 600; }
    .welcome { background: #fff; border: 1px solid #e0e0e0; border-radius: 14px; padding: 14px; margin: 8px 0; }
    .welcome h3 { margin: 0 0 4px; font-size: 17px; }
    .welcome .topic { font-size: 15px; margin: 6px 0 10px; }
    .welcome ol { margin: 6px 0 12px; padding-left: 20px; font-size: 13px; color: #444; line-height: 1.6; }
    .welcome .go { width: 100%; font-size: 16px; padding: 12px; border-radius: 10px; }
    .welcome .sub { font-size: 12px; color: #777; }
    .welcome .stage { font-size: 12px; color: #555; margin-top: 8px; }
    .bar100 { height: 6px; background: #eee; border-radius: 3px; margin: 4px 0 8px; overflow: hidden; }
    .bar100 div { height: 100%; background: #34a853; }
    .topicnav { display: flex; align-items: center; gap: 8px; }
    .topicnav .topic { flex: 1; margin: 6px 0; }

    .txt { width: 100%; font-size: 16px; padding: 10px; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 8px; }
    .loginerr { background: #fde7e7; color: #a00; border-radius: 8px; padding: 8px; margin-top: 8px; font-size: 13px; }
    details { margin: 4px 0 10px; }

    #micBanner { display: none; align-items: center; gap: 8px; flex-wrap: wrap; background: #fff8e1;

    .mitem a { font-size: 12px; color: #1a73e8; }

    .pyhead { display: flex; justify-content: space-between; align-items: center; }
    .pyword { font-size: 52px; text-align: center; margin: 14px 0 2px; letter-spacing: 4px; }
    .pypy { font-size: 22px; text-align: center; color: #1a4fb0; margin-bottom: 2px; }
    .pytip { background: #e8f0fe; border-radius: 8px; padding: 8px 10px; margin: 8px 0; font-size: 14px; }
    .pybtns { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .pybtns .go { flex: 2; padding: 14px; border-radius: 10px; font-size: 17px; }
    .pybtns .secondary { flex: 1; }
    .sylrow { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin: 10px 0 4px; }
    .syl { border-radius: 10px; padding: 6px 10px; text-align: center; min-width: 58px; border: 2px solid; }
    .syl .h { font-size: 22px; } .syl .p { font-size: 15px; font-weight: 600; } .syl .n { font-size: 11px; }
    .syl.ok { border-color: #34a853; background: #e6f4ea; } .syl.tone { border-color: #f9ab00; background: #fef7e0; } .syl.bad { border-color: #ea4335; background: #fce8e6; }
    .pitchcv { width: 100%; height: 150px; display: block; background: #fcfcfc; border: 1px solid #eee; border-radius: 10px; margin-top: 10px; }
    .pylive { font-size: 15px !important; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 13px; color: #555; margin-top: 4px; min-height: 18px; }
    .pybtns .go.rec { background: #d93025; animation: pulse 1s infinite; }

    .pyverdict.good { color: #137333; }

    .pyb .bar100 { margin: 0; }
    .msg.cele { background: linear-gradient(135deg, #fff8e1, #e6f4ea); border: 1px solid #f9d77e; font-weight: 600; max-width: 100%; }
    #toast { position: fixed; left: 50%; bottom: 90px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; z-index: 60;
      background: #202124; color: #fff; border-radius: 12px; padding: 10px 16px; font-size: 14px; max-width: 92vw; text-align: center;
      transition: opacity .3s, transform .3s; box-shadow: 0 6px 20px rgba(0,0,0,.3); }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    #toast.big { font-size: 16px; padding: 14px 20px; background: #137333; }
  </style>
</head>
<body>
  <div class="bar">
    <select id="lang" onchange="onLangChange()" autocomplete="off">
      <option value="zh">🇨🇳 Mandarin</option>
      <option value="es">🇦🇷 Argentine Spanish</option>
      <option value="de">🇩🇪 German</option>
      <option value="__setup">🌐 Languages…</option>
    </select>
    <select id="level" onchange="onLevelChange()">
      <option value="beginner">Beginner</option>
      <option value="intermediate">Intermediate</option>
      <option value="fluent">Fluent</option>
    </select>
    <select id="skill" onchange="onSkillChange()">
      <option value="guided">⭐ Guided practice</option>
      <option value="speaking">🗣 Speaking</option>
      <option value="reading">📖 Reading</option>
      <option value="writing">✏️ Writing</option>
      <option value="test">🧪 Level test</option>
      <option value="pinyin">🎯 Pinyin & tones</option>
    </select>
    <select id="audience" onchange="onAudienceChange()" title="Who is learning: sets age-appropriate themes">
      <option value="adults">🧑 Adults</option>
      <option value="teens">🧑‍🎓 Teens</option>
      <option value="kids">🧒 Kids</option>
    </select>
    <select id="mode" onchange="onModeChange()">
      <option value="auto">Auto (Haiku → Sonnet)</option>
      <option value="haiku">Haiku only</option>
      <option value="sonnet">Sonnet only</option>
    </select>
    <select id="activity"></select>
    <button onclick="startSession()">Start</button>
    <button class="secondary" onclick="resetSession()">New</button>
    <button class="secondary" id="spk" onclick="toggleSpeak()">🔊 On</button>
    <button class="secondary" id="progBtn" onclick="showProgress()" title="Goals, streak and tests">📈</button>
    <button class="secondary" id="wordBtn" onclick="toggleWords()" title="Tap or hover a word to see its meaning">🔍 Words</button>
    <span class="sub" id="ver" style="align-self:center;font-size:11px;color:#999"></span>
    <button class="secondary" id="cfgBtn" onclick="reconnect()" title="Switch learner / settings" style="display:none">⚙</button>
  </div>
  <div class="hint"><span id="who" class="who" style="display:none"></span> <span id="hint"></span></div>

  <div id="micBanner">
    <span id="micText">🎤 Allow the microphone so you can answer out loud.</span>
    <button id="micAllow" onclick="requestMic()">Allow microphone</button>
  </div>

  <div id="phases"></div>

  <div id="log"></div>

  <div class="chips" id="chips"></div>

  <div id="pad">
    <canvas id="canvas"></canvas>
    <div class="padbar">
      <button class="secondary" onclick="clearPad()">🧽 Clear</button>
      <button class="secondary" onclick="document.getElementById('photo').click()">📷 Photo of paper</button>
      <button onclick="sendDrawing()">Send handwriting</button>
    </div>
    <input type="file" id="photo" accept="image/*" capture="environment" onchange="sendPhoto(this)">
  </div>

  <div class="row">
    <button id="mic">🎤</button>
    <select id="pause" class="pause" onchange="onPauseChange()" title="How long a pause sends your answer">
      <option value="2000">⏱ 2s</option>
      <option value="3000">⏱ 3s</option>
      <option value="5000">⏱ 5s</option>
      <option value="8000">⏱ 8s</option>
      <option value="0">✋ Tap ⏹</option>
      <option value="hold">🎙 Hold to talk</option>
    </select>
    <button class="secondary" id="padBtn" onclick="togglePad()" style="display:none">✏️</button>
    <textarea id="input" placeholder="Type or speak…"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send();}"></textarea>
    <button id="sendBtn" onclick="send()">Send</button>
  </div>

<script>
  // ---------- Backend bridge ----------
  // Works two ways:
  //  • Inside Google (Sheets sidebar / Apps Script web app): uses google.script.run.
  //  • As a normal website (GitHub Pages etc.): calls the Apps Script web app over HTTPS,
  //    which is what lets the microphone work. Asks once for the web app URL and PIN.
  const IN_GOOGLE = !!(window.google && google.script && google.script.run);

  function getConfig() {
    let c = {};
    try { c = JSON.parse(localStorage.getItem('tutorConfig') || '{}'); } catch (e) {}
    if (!c.code && c.pin) c.code = c.pin; // older versions called it a PIN
    return c;
  }

  function saveConfig(c) {
    try { localStorage.setItem('tutorConfig', JSON.stringify({ url: c.url || '', code: c.code || '' })); } catch (e) {}
  }

  // A personal link looks like  …/Language-tutor/?api=<web app URL>&code=ABCD1234
  (function readLinkParams() {
    if (IN_GOOGLE) return;
    const q = new URLSearchParams(location.search);
    if (!q.get('api') && !q.get('code')) return;
    const c = getConfig();
    if (q.get('api')) c.url = q.get('api').trim();
    if (q.get('code')) c.code = q.get('code').trim();
    saveConfig(c);
    try { history.replaceState(null, '', location.pathname); } catch (e) {} // keep the code out of the address bar
  })();

  const NEED_LOGIN = 'NEED_LOGIN';

  // Network failures ("Failed to fetch") are retried once after a short wait; if it still fails,
  // a quick ping tells apart "no internet / wrong link" from "the server had a problem with this request".
  function call(fn, ...args) {
    if (IN_GOOGLE) {
      return new Promise((resolve, reject) =>
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).api(fn, args));
    }
    return callOnce(fn, args).catch(err => {
      if (!err || !err.network) throw err;
      return new Promise(r => setTimeout(r, 2000)).then(() => callOnce(fn, args)).catch(err2 => {
        if (!err2 || !err2.network) throw err2;
        return diagnose().then(msg => { throw new Error(msg); });
      });
    });
  }

  function diagnose() {
    const c = getConfig();
    if (!navigator.onLine) return Promise.resolve('Your phone is offline. Reconnect, then tap ↻ Retry.');
    const sep = c.url.indexOf('?') >= 0 ? '&' : '?';
    return fetch(c.url + sep + 'ping=1')
      .then(r => r.text())
      .then(t => {
        let d = null;
        try { d = JSON.parse(t); } catch (e) {}
        if (d && d.ok) return 'The tutor server is up, but this message failed — usually it took too long, or the server was being updated. Tap ↻ Retry.';
        return 'The tutor server link answered with a page instead of data — the newest code may not be deployed yet (Manage deployments → Edit → New version). Then tap ↻ Retry.';
      })
      .catch(() => 'Can\'t reach the tutor server. Check your internet, or tap ⚙ to check the server link, then tap ↻ Retry.');
  }

  function callOnce(fn, args) {
    const c = getConfig();
    if (!c.url || !c.code) return Promise.reject(new Error(NEED_LOGIN));
    return fetch(c.url, {
      method: 'POST',
      // text/plain avoids a CORS pre-flight, which Apps Script can't answer
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ code: c.code, fn: fn, args: args })
    })
      .then(r => r.text().then(t => ({ status: r.status, url: r.url, text: t })))
      .then(r => {
        let d;
        try { d = JSON.parse(r.text); }
        catch (e) { throw new Error(explainBadReply(r, fn)); }
        if (d.code === 'BAD_CODE') {
          const c2 = getConfig(); c2.code = ''; saveConfig(c2);
          showLogin('That access code was not recognised or has been disabled.');
          throw new Error(NEED_LOGIN);
        }
        if (d.error) throw new Error(d.error);
        return d.result;
      }, err => {
        const e = new Error('Could not reach the tutor server (' + err.message + ').');
        e.network = true;
        throw e;
      });
  }

  // Apps Script sent a web page instead of data: say what that page was.
  function explainBadReply(r, fn) {
    const t = r.text || '';
    const title = ((t.match(/<title>([^<]*)<\/title>/i) || [])[1] || '').trim();
    const plain = t.replace(/<script[\s\S]*?<\/script>|<style[\s\S]*?<\/style>/gi, ' ')
      .replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
    const where = ' [' + fn + ', HTTP ' + r.status + ']';
    if (/accounts\.google\.com|ServiceLogin|Sign in/i.test(r.url + ' ' + title + ' ' + plain.slice(0, 300)))
      return 'Google asked for a sign-in, so the deployment is not open to "Anyone" (it may be "Anyone with Google account"), ' +
        'or the URL is an old/test deployment. Deploy → Manage deployments → Edit → Who has access: Anyone → New version → Deploy, then copy that URL into ⚙.' + where;
    if (/Script function not found: doPost/i.test(plain))
      return 'The deployed code has no doPost. Paste the latest Code.gs, then Deploy → Manage deployments → Edit → Version: New version → Deploy.' + where;
    if (/Authori[sz]ation is required|needs your permission|authorize/i.test(plain))
      return 'Apps Script needs permission again. In the editor, pick "setupSheets" and press Run, approve the access, then try again.' + where;
    if (/unable to open the file|Page Not Found|not found/i.test(title + ' ' + plain.slice(0, 200)))
      return 'That web app URL does not exist (the deployment may have been archived). Copy the current Web app URL into ⚙.' + where;
    if (r.status === 429 || /too many|quota|Service invoked/i.test(plain))
      return 'Apps Script hit a daily limit or is busy. Wait a minute and try again.' + where;
    return 'Apps Script sent a page instead of data: "' + (title ? title + ' — ' : '') + plain.slice(0, 160) + '"' + where;
  }

  function showApiError(err) {
    if (err && err.message === NEED_LOGIN) { showLogin(); return; }
    const s = state[lang()];
    s.view.push({ who: 'err', text: 'Connection problem: ' + err.message });
    render();
  }

  // ⚙ = switch learner / change the server link
  function reconnect() {
    showLogin('', true);
  }

  // ---------- Login (access code) ----------

  let loginShown = false;

  function showLogin(message, allowCancel) {

  // Languages come from the server (getLanguages); these are just the starting defaults.
  var LANGS = {
    zh: { code: 'zh', name: 'Mandarin Chinese', flag: '🇨🇳', speech: 'zh-CN', script: true, roman: 'pinyin' },
    es: { code: 'es', name: 'Argentine Spanish', flag: '🇦🇷', speech: 'es-AR' },
    de: { code: 'de', name: 'German', flag: '🇩🇪', speech: 'de-DE' }
  };

  function langInfo(l) { return LANGS[l] || { code: l, name: l, flag: '🌐', speech: l }; }
  function speechOf(l) { return langInfo(l).speech || l; }
  function voicePrefs(l) { const s = speechOf(l); return VOICE_FALLBACKS[s] || [s, s.split('-')[0]]; }
  function isScript(l) { return !!langInfo(l).script; }
  function helpSpeech() { return helpLang === 'en' ? 'en-IN' : ((HELP_LANGS[helpLang] || {}).speech || 'en-IN'); }
  const state = new Proxy({}, { get: (t, k) => { if (!(k in t)) t[k] = { messages: [], view: [] }; return t[k]; } });

  // ---------- Resume: the session in progress is kept on this device ----------
  // (Level, topic, vocab and reviews are saved on the server; this keeps the conversation itself,
  //  so closing the page or switching language continues where you left off.)
  const KEEP_DAYS = 3;

  function storeKey(l) {
    const who = IN_GOOGLE ? 'owner' : (getConfig().code || 'anon');
    return 'tutorSession_' + who + '_' + l;
  }

  function noImages(msgs) {
    return msgs.map(m => (Array.isArray(m.content) && m.content.some(b => b.type === 'image'))
      ? { role: m.role, content: m.content.filter(b => b.type !== 'image').concat([{ type: 'text', text: '(handwriting image not kept)' }]) }
      : m);
  }

  function saveLocal(l) {
    const s = state[l];
    try {
      if (!s.messages.length) { localStorage.removeItem(storeKey(l)); return; }
      localStorage.setItem(storeKey(l), JSON.stringify({
        savedAt: Date.now(), skill: s.skill || skill, custom: s.custom || '',
        messages: noImages(s.messages),
        view: s.view.filter(v => v.text !== '…').map(v => v.img ? Object.assign({}, v, { img: null, text: v.text || '✏️ Handwriting' }) : v),
        phase: phase[l] || 0, task: testTask[l] || 0, completed: !!completed[l]
      }));
    } catch (e) { /* storage full or blocked: resume just won't be available */ }
  }

  function restoreLocal() {
    const prefix = storeKey('');
    const codes = [];
    try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.indexOf(prefix) === 0) codes.push(k.slice(prefix.length)); } } catch (e) {}
    codes.forEach(l => {
      try {
        const d = JSON.parse(localStorage.getItem(storeKey(l)) || 'null');
        if (!d || !d.messages || !d.messages.length) return;
        if (Date.now() - d.savedAt > KEEP_DAYS * 86400000) { localStorage.removeItem(storeKey(l)); return; }
        state[l] = { messages: d.messages, view: d.view || [], skill: d.skill, custom: d.custom || '', resumedAt: d.savedAt };
        phase[l] = d.phase || 0;
        testTask[l] = d.task || 0;
        completed[l] = !!d.completed;
      } catch (e) {}
    });
  }

  // Pull "[Phase N/7: Name]" off the reply, update the bar, and return the text without it.
  function takePhase(text, l) {
    // the tag can come after a short intro line, so look anywhere; keep the highest phase if there are several
    const re = /\[Phase (\d)\/7:[^\]]*\]/g;
    let m, found = 0;
    while ((m = re.exec(text))) found = Math.max(found, Number(m[1]));
    if (!found) return text;
    phase[l] = found;
    renderPhases();
    return text.replace(/[ \t]*\[Phase \d\/7:[^\]]*\][ \t]*\n?/g, '').replace(/\n{3,}/g, '\n\n').trim();
  }

  function loadSummary(l, then) {
    l = l || lang();
    return call('getProgressSummary', l, levels[l]).then(s => {
      const before = summary[l];

      if (then) then(s, before);

  // One-line strip on the welcome card
  function progressStrip() {
    const s = summary[lang()];
    const d = document.createElement('div');
    d.className = 'pstrip';
    if (!s) { d.textContent = '📈 Loading your progress…'; return d; }
    const bits = [];
    bits.push(s.streak ? '🔥 ' + s.streak + '-day streak' : (s.practisedToday ? '🔥 Day 1!' : '🔥 Start a streak today'));
    if (s.goal) {
      const look = STATUS_LOOK[s.goal.status] || STATUS_LOOK['on-track'];
      bits.push('🎯 ' + s.goal.name + ' ' + s.goal.percent + '%');
      bits.push(look[0]);
      bits.push('⏱ ' + s.minutesWeek + '/' + s.goal.minutesTargetWeek + ' min this week');
    } else bits.push('🎯 Set a goal');
    d.textContent = bits.join(' · ');
    const b = document.createElement('span');
    b.className = 'plink';
    b.textContent = ' 📈 See progress';
    d.appendChild(b);
    d.onclick = showProgress;
    return d;
  }

  function weekDots(s) {
    const L = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
    return '<div class="dots">' + s.week.map(w => {
      const day = L[new Date(w.date + 'T12:00:00').getDay()];
      return '<div class="dot' + (w.practised ? ' on' : w.minutes ? ' some' : '') + '" title="' + w.date + ': ' + w.minutes + ' min, ' + w.sessions + ' sessions">' +
        '<span>' + (w.practised ? '✓' : '') + '</span><small>' + day + '</small></div>';
    }).join('') + '</div>';
  }

  function ring(pct) {
    const r = 34, c = 2 * Math.PI * r, off = c * (1 - Math.min(100, pct) / 100);
    return '<svg class="ring" viewBox="0 0 84 84"><circle cx="42" cy="42" r="' + r + '" stroke="#eee" stroke-width="9" fill="none"/>' +
      '<circle cx="42" cy="42" r="' + r + '" stroke="#34a853" stroke-width="9" fill="none" stroke-linecap="round" ' +
      'stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '" transform="rotate(-90 42 42)"/>' +
      '<text x="42" y="47" text-anchor="middle" font-size="17" font-weight="700" fill="#202124">' + pct + '%</text></svg>';
  }

  function cheer(s) {
    if (!s.totalSessions && !s.words) return 'Every expert started with one session. Today is a great day for yours. 🌱';
    if (s.practisedToday && s.streak >= 7) return 'A ' + s.streak + '-day streak — this is how people really learn a language. 🔥';
    if (s.practisedToday) return 'You practised today. Your brain is wiring in new words while you sleep. 😴🧠';
    if (s.streak) return 'Keep your ' + s.streak + '-day streak alive — even 10 minutes counts today.';
    return 'Welcome back! One short session gets you moving again.';
  }

  function showProgress() {
    const l = lang();
    progressOpen = true;
    let box = document.getElementById('progress');
    if (!box) { box = document.createElement('div'); box.id = 'progress'; document.body.appendChild(box); }
    box.style.display = 'block';
    const s = summary[l];
    if (!s) { box.innerHTML = '<div class="pcard"><h3>📈 Your progress</h3><div class="sub">Loading…</div></div>'; loadSummary(l); return; }
    const g = s.goal;
    let html = '<div class="pcard"><div class="phead"><h3>📈 ' + escapeHtml(langInfo(l).flag + ' ' + langInfo(l).name) + ' progress</h3>' +
      '<button class="secondary" id="pClose">✕</button></div>' +

  // ---------- Pinyin & tones trainer (Chinese) ----------

  var py = { screen: 'start', drill: null, idx: 0, tries: 0, results: [], first: null, check: false, focus: 'auto', recent: [], stats: null, last: null, busy: false };

    T4: 'Tone 4 ` — a sharp fall, like a firm “No!”: «骂».',
    retro: 'zh ch sh r — curl the tongue tip back toward the roof of your mouth.',
    flat: 'z c s — tongue tip flat behind your top teeth, no curl.',

    ['yibu', '一 and 不 tone changes'], ['zcs', 'zh ch sh r vs z c s'], ['jqx', 'j q x and ü'], ['nng', '-n vs -ng'], ['finals', 'Tricky finals'], ['phrases', 'Phrases & sentences']];

  function loadPinyinLib() {
    if (window.pinyinPro) return Promise.resolve();
    if (loadPinyinLib.p) return loadPinyinLib.p;
    loadPinyinLib.p = new Promise((ok, bad) => {

  function sylls(text) {
    return pinyinPro.pinyin(String(text), { type: 'all', toneType: 'none', nonZh: 'removed' })
      .filter(x => x.isZh).map(x => ({ ch: x.origin, i: x.initial || '', f: x.final || '', t: x.num || 0 }));

  // Align heard syllables to target syllables (edit distance), then grade each target syllable.
  function grade(target, heardText) {
    const T = sylls(target), H = sylls(heardText);
    const cost = (a, b) => (a.i !== b.i ? 1 : 0) + (a.f !== b.f ? 1 : 0) + (a.t !== b.t && a.t ? 1 : 0);
    const n = T.length, m = H.length, D = [];
    for (let x = 0; x <= n; x++) { D[x] = []; for (let y = 0; y <= m; y++) D[x][y] = x === 0 ? y * 3 : y === 0 ? x * 3 : 0; }
    for (let x = 1; x <= n; x++) for (let y = 1; y <= m; y++)
      D[x][y] = Math.min(D[x - 1][y - 1] + cost(T[x - 1], H[y - 1]), D[x - 1][y] + 3, D[x][y - 1] + 3);
    const out = new Array(n);
    let x = n, y = m;
    while (x > 0) {
      if (y > 0 && D[x][y] === D[x - 1][y - 1] + cost(T[x - 1], H[y - 1])) { out[x - 1] = H[y - 1]; x--; y--; }
      else if (D[x][y] === D[x - 1][y] + 3) { out[x - 1] = null; x--; }
      else y--;
    }
    const res = T.map((s, k) => {
      const h = out[k];
      return { ch: s.ch, i: s.i, f: s.f, t: s.t, heard: h,
        okI: !!h && h.i === s.i, okF: !!h && h.f === s.f, okT: !!h && (s.t === 0 || h.t === s.t) };
    });
    const pts = res.reduce((a, r) => a + r.okI + r.okF + 2 * r.okT, 0);
    return { sylls: res, score: n ? pts / (4 * n) : 0, ok: res.every(r => r.okI && r.okF && r.okT), extra: Math.max(0, m - n) };
  }

  function bestGrade(target, alts) {
    const clean = s => String(s).replace(/[\s，。！？、,.!?]/g, '');
    let best = null;
    alts.forEach(a => {
      const g = clean(a) === clean(target) ? Object.assign(grade(target, target), { exact: true }) : grade(target, a);
      g.text = a;
      if (!best || g.score > best.score) best = g;
    });
    return best || Object.assign(grade(target, ''), { text: '' });
  }

  function pyTipFor(g) {
    const bad = g.sylls.find(r => !(r.okI && r.okF && r.okT));
    if (!bad) return '';
    if (!bad.heard) return 'I didn\'t catch «' + bad.ch + '». Say every syllable clearly, a bit slower.';
    if (!bad.okI) return /^(zh|ch|sh|r)$/.test(bad.i) ? PY_TIPS.retro : /^(z|c|s)$/.test(bad.i) ? PY_TIPS.flat : /^(j|q|x)$/.test(bad.i) ? PY_TIPS.palatal : PY_TIPS.other;
    if (!bad.okF) return /ü/.test(bad.f) ? PY_TIPS.u : /ng$/.test(bad.f) ? PY_TIPS.ng : /n$/.test(bad.f) ? PY_TIPS.n : PY_TIPS.other;
    return PY_TIPS['T' + bad.t] || PY_TIPS.other;
  }

  function pySay(text, slow) {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);

    speechSynthesis.speak(u);
  }

  // ---------- Live mic: press once, it keeps listening and "catches" the right sound ----------
  var pyRec = null;
  function pyMicOn() {
    if (!SR) { alert('Pronunciation checking needs speech recognition — use Chrome (desktop or Android) or Edge.'); return; }
    py.live = true; py.micError = ''; py.hearing = '';
    pyRecStart();
    pitchStart();
    renderPinyin();
  }
  function pyMicOff() {
    py.live = false; py.ready = false; py.hearing = '';
    if (pyRec) { const r = pyRec; pyRec = null; try { r.abort ? r.abort() : r.stop(); } catch (e) {} }
    pitchStop();
  }
  function pyRecStart() {
    const r = new SR();
    pyRec = r;
    r.lang = 'zh-CN'; r.interimResults = true; r.maxAlternatives = 5; r.continuous = true;
    py.baseIdx = 0; py.resLen = 0;
    r.onaudiostart = () => { py.ready = true; renderPinyin(); };
    r.onresult = e => {
      py.resLen = e.results.length;
      for (let k = Math.max(e.resultIndex, py.baseIdx); k < e.results.length; k++) {
        const res = e.results[k];
        if (Date.now() < (py.ttsUntil || 0)) { if (res.isFinal) py.baseIdx = k + 1; continue; } // that was the model voice
        const it = pyItem();
        if (!it || py.screen !== 'item' || py.advancing) { if (res.isFinal) py.baseIdx = k + 1; continue; }
        const alts = []; for (let a = 0; a < res.length; a++) alts.push(res[a].transcript);
        const g = bestGrade(it.hanzi, alts);
        if (g.ok && !py.check) { py.baseIdx = k + 1; pyAttempt(g); return; }      // caught it!
        if (res.isFinal) { py.baseIdx = k + 1; pyAttempt(g); return; }             // a finished try that was off
        py.hearing = hearingText(alts[0]);                                        // still speaking: show it live
        const h = document.getElementById('pyHearing'); if (h) h.textContent = py.hearing;
      }
    };
    r.onerror = e => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { py.micError = 'Microphone blocked — allow it for this site (🔒 in the address bar).'; pyMicOff(); renderPinyin(); }
      else if (e.error === 'audio-capture') { py.micError = 'No microphone found — check your sound input settings.'; pyMicOff(); renderPinyin(); }
      else if (e.error === 'network') { py.micError = 'Speech recognition needs internet — check your connection.'; }
    };

      if (pyRec !== r) return;
      pyRec = null;
      if (py.live) setTimeout(() => { if (py.live && !pyRec) pyRecStart(); }, 200);
    };
    try { r.start(); } catch (e) { pyRec = null; }
  }

  // ---------- Pitch tracker (Web Audio): your voice's pitch against the target tone shapes ----------
  var pitch = { on: false, frames: [], utt: null, last: null, all: [], lastVoiced: 0 };
  function pitchStart() {
    if (pitch.on || !navigator.mediaDevices || !window.AudioContext && !window.webkitAudioContext) return;
    pitch.on = true;
    navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } }).then(stream => {
      if (!py.live) { stream.getTracks().forEach(t => t.stop()); pitch.on = false; return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      pitch.stream = stream; pitch.ctx = new AC();
      const src = pitch.ctx.createMediaStreamSource(stream);
      pitch.an = pitch.ctx.createAnalyser(); pitch.an.fftSize = 2048;
      src.connect(pitch.an);
      pitch.buf = new Float32Array(pitch.an.fftSize);
      const loop = () => { if (!pitch.on) return; pitchTick(); pitch.raf = requestAnimationFrame(loop); };
      loop();
    }).catch(() => { pitch.on = false; py.pitchOff = true; });
  }
  function pitchStop() {
    pitch.on = false;
    if (pitch.raf) cancelAnimationFrame(pitch.raf);
    if (pitch.stream) pitch.stream.getTracks().forEach(t => t.stop());

  // Autocorrelation pitch detector; returns Hz or 0 (unvoiced / too quiet).
  function detectPitch(buf, sr) {
    let rms = 0; for (let i = 0; i < buf.length; i++) rms += buf[i] * buf[i];
    rms = Math.sqrt(rms / buf.length);
    if (rms < 0.012) return { f: 0, rms: rms };
    const minLag = Math.floor(sr / 500), maxLag = Math.floor(sr / 70), n = buf.length - maxLag;
    let best = 0, bestLag = 0, e0 = 0;
    const R = [];
    for (let i = 0; i < n; i++) e0 += buf[i] * buf[i];
    for (let lag = minLag; lag <= maxLag; lag++) {
      let c = 0, e1 = 0;
      for (let i = 0; i < n; i++) { c += buf[i] * buf[i + lag]; e1 += buf[i + lag] * buf[i + lag]; }
      const r = c / Math.sqrt(e0 * e1 + 1e-9);
      R[lag] = r;
      if (r > best) best = r;
    }
    // the first strong peak is the real pitch (later peaks are octave errors)
    for (let lag = minLag + 1; lag < maxLag; lag++) {
      if (R[lag] >= best * 0.9 && R[lag] >= R[lag - 1] && R[lag] >= R[lag + 1]) { bestLag = lag; break; }
    }
    return { f: best > 0.75 && bestLag ? sr / bestLag : 0, rms: rms };
  }
  function pitchTick() {
    if (!pitch.an) return;
    pitch.an.getFloatTimeDomainData(pitch.buf);
    const now = performance.now();
    if (Date.now() < (py.ttsUntil || 0)) { pitch.utt = null; drawPitch(); return; } // ignore the model voice
    const p = detectPitch(pitch.buf, pitch.ctx.sampleRate);
    py.level = Math.min(1, p.rms * 12);
    if (p.f) {
      const st = 12 * Math.log2(p.f / 100);
      if (!pitch.utt) pitch.utt = [];
      pitch.utt.push({ t: now, st: st });
      pitch.all.push(st); if (pitch.all.length > 3000) pitch.all.splice(0, 1000);
      pitch.lastVoiced = now;
    } else if (pitch.utt && now - pitch.lastVoiced > 350) {
      if (pitch.utt.length >= 6) {
        pitch.last = pitch.utt; py.toneGuess = guessTone(pitch.last);
        const it = pyItem(); py.match = it ? toneMatch(pitch.last, it) : null;
        const tg = document.getElementById('pyTone'); if (tg) tg.textContent = [toneMatchText(), toneGuessText()].filter(Boolean).join('  ·  ');
      }
      pitch.utt = null;
    } else if (pitch.utt) pitch.utt.push({ t: now, st: null });

  }
  // Your comfortable range → Chao tone levels 1 (low) … 5 (high)
  function pitchRange() {
    const a = pitch.all.slice().sort((x, y) => x - y);
    if (a.length < 20) { const m = a.length ? a[Math.floor(a.length / 2)] : 0; return [m - 4, m + 4]; }
    let lo = a[Math.floor(a.length * 0.08)], hi = a[Math.floor(a.length * 0.92)];
    if (hi - lo < 6) { const mid = (hi + lo) / 2; lo = mid - 3; hi = mid + 3; }
    return [lo, hi];
  }
  function toLevel(st, rg) { return 1 + 4 * (st - rg[0]) / (rg[1] - rg[0]); }
  function smoothLevels(utt, rg) {
    const pts = utt.filter(x => x.st != null).map(x => ({ t: x.t, v: toLevel(x.st, rg) }));
    return pts.map((p, i) => { const w = pts.slice(Math.max(0, i - 2), i + 3).map(q => q.v).sort((a, b) => a - b); return { t: p.t, v: w[Math.floor(w.length / 2)] }; });
  }
  function toneGuess_(pts) {
    if (pts.length < 5) return 0;
    const k = Math.max(1, Math.floor(pts.length / 5));
    const avg = a => a.reduce((x, y) => x + y.v, 0) / a.length;
    const s = avg(pts.slice(0, k)), e = avg(pts.slice(-k));
    let mn = Infinity, mi = 0, mx = -Infinity;
    pts.forEach((p, i) => { if (p.v < mn) { mn = p.v; mi = i; } if (p.v > mx) mx = p.v; });
    const pos = mi / (pts.length - 1), range = mx - mn;
    if (range < 1) return s >= 3.3 ? 1 : s <= 2 ? 3 : -1; // level: high = tone 1, low = half 3rd tone, middle = unclear
    if (pos > 0.2 && pos < 0.8 && s - mn >= 0.7 && e - mn >= 0.7) return 3; // dips then rises
    if (e - s >= 0.9) return 2;                         // rises
    if (s - e >= 1.1) return mn < 1.8 && pos > 0.6 && s < 3.3 ? 3 : 4; // falls (low fall = half 3rd tone)
    if (mn < 1.8) return 3;                             // stays low
    return 0;
  }
  function guessTone(utt) { return toneGuess_(smoothLevels(utt, pitchRange())); }
  function toneGuessText() {
    const it = pyItem();
    if (!it || !py.toneGuess) return '';
    const T = sylls(it.hanzi);
    const shape = { 1: 'high & level → tone 1', 2: 'rising → tone 2', 3: 'low / dipping → tone 3', 4: 'falling → tone 4', '-1': 'level but low — lift it higher for tone 1' }[py.toneGuess] || '';
    if (T.length !== 1) return shape ? '📈 Your pitch shape: ' + shape : '';
    const want = T[0].t, ok = py.toneGuess === want;
    return '📈 Your pitch: ' + shape + (want ? (ok ? ' ✓' : ' — target is tone ' + want) : '');
  }
  // Target tone shapes in Chao levels, with 3rd-tone changes in context.
  function targetContours(T) {
    return T.map((s, k) => {
      const next = T[k + 1], last = k === T.length - 1;
      if (s.t === 1) return [5, 5];
      if (s.t === 2) return [3, 5];
      if (s.t === 4) return [5, 1];
      if (s.t === 3) return next && next.t === 3 ? [3, 5] : last ? [2, 1, 4] : [2, 1, 1];
      return [3, 3];
    });
  }
  function pitchCanvas() {
    if (!py.cv) {
      py.cv = document.createElement('canvas');

    }

  }
  function drawPitch() {
    const cv = py.cv, it = pyItem();
    if (!cv || !cv.isConnected || !it) return;
    const dpr = window.devicePixelRatio || 1, W = Math.round((cv.clientWidth || 600) * dpr), H = Math.round((cv.clientHeight || 150) * dpr);
    if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
    const g = cv.getContext('2d'); if (!g) return;
    g.clearRect(0, 0, W, H);
    const pad = 14 * dpr, y = v => H - pad - (Math.max(0.5, Math.min(5.5, v)) - 1) / 4 * (H - 2 * pad);
    g.font = (10 * dpr) + 'px system-ui'; g.fillStyle = '#999'; g.strokeStyle = '#eee'; g.lineWidth = dpr;
    [1, 3, 5].forEach(v => { g.beginPath(); g.moveTo(0, y(v)); g.lineTo(W, y(v)); g.stroke(); });
    g.fillText('high', 4 * dpr, y(5) - 3 * dpr); g.fillText('low', 4 * dpr, y(1) + 11 * dpr);
    const T = sylls(it.hanzi), C = targetContours(T), slot = W / T.length;
    // target shapes: thick green bands, one slot per syllable
    C.forEach((c, k) => {
      g.strokeStyle = 'rgba(52,168,83,.28)'; g.lineWidth = 16 * dpr; g.lineCap = 'round'; g.lineJoin = 'round';
      g.beginPath();
      c.forEach((v, j) => { const x = slot * k + slot * (0.15 + 0.7 * j / (c.length - 1)); j ? g.lineTo(x, y(v)) : g.moveTo(x, y(v)); });
      g.stroke();
      g.fillStyle = '#137333'; g.fillText(marked(T[k].ch)[0] || '', slot * k + slot / 2 - 8 * dpr, H - 2 * dpr);
    });
    // your voice: blue line, stretched over the same width
    const utt = pitch.utt || pitch.last;
    if (utt && utt.length > 2) {
      const rg = pitchRange(), pts = smoothLevels(utt, rg);
      if (pts.length > 1) {
        const t0 = utt[0].t, t1 = pitch.utt ? Math.max(utt[utt.length - 1].t, t0 + 900) : utt[utt.length - 1].t;
        g.strokeStyle = pitch.utt ? '#1a73e8' : '#174ea6'; g.lineWidth = 3.5 * dpr; g.lineCap = 'round';
        g.beginPath();
        let prevT = null;
        pts.forEach(p => {
          const x = slot * 0.15 / T.length + (W - slot * 0.3 / T.length) * (p.t - t0) / Math.max(1, t1 - t0);
          if (prevT == null || p.t - prevT > 120) g.moveTo(x, y(p.v)); else g.lineTo(x, y(p.v));
          prevT = p.t;
        });
        g.stroke();
      }
    }
    // volume pulse
    if (py.live) { g.fillStyle = py.level > 0.15 ? '#d93025' : '#ccc'; g.beginPath(); g.arc(W - 10 * dpr, 10 * dpr, (4 + 8 * (py.level || 0)) * dpr, 0, 7); g.fill(); }
  }

  // "👂 You're saying: téng (疼)"
  function hearingText(t) {
    const p = (window.pinyinPro && /[\u4e00-\u9fff]/.test(t)) ? marked(t).join(' ') : '';
    return '👂 You\'re saying: ' + (p ? p + '  (' + t + ')' : t);
  }

  // How close your pitch shape is to the target tones: % per syllable (time split evenly across syllables).
  function toneMatch(utt, it) {
    const T = sylls(it.hanzi), C = targetContours(T);
    const pts = smoothLevels(utt, pitchRange());
    if (pts.length < 6 || !T.length) return null;
    const t0 = pts[0].t, span = Math.max(1, pts[pts.length - 1].t - t0);
    const per = T.map((s, k) => {
      const mine = pts.filter(p => (p.t - t0) / span >= k / T.length && (p.t - t0) / span <= (k + 1) / T.length);
      if (mine.length < 2) return { ch: s.ch, pct: 0 };
      const c = C[k];
      // compare shapes after removing each one's average height offset a little (people speak higher/lower)
      const tgt = mine.map((p, i) => { const x = i / (mine.length - 1) * (c.length - 1), j = Math.min(c.length - 2, Math.floor(x)); return c[j] + (c[j + 1] - c[j]) * (x - j); });
      const off = (mine.reduce((a, p) => a + p.v, 0) - tgt.reduce((a, v) => a + v, 0)) / mine.length * 0.5;
      const mad = mine.reduce((a, p, i) => a + Math.abs(p.v - off - tgt[i]), 0) / mine.length;

  function toneMatchText() {

  }

  function pyAttempt(g) {
    py.last = g;

  }

  function pyNext() {
    const it = pyItem();

        .map(r => ({ i: /^[yw]?$/.test(r.i) ? '' : r.i, f: r.f, t: r.t, okI: r.okI, okF: r.okF, okT: r.okT })) });

    }
    py.idx++; py.tries = 0; py.first = null; py.last = null; py.micError = ''; py.advancing = false; py.hearing = ''; py.toneGuess = 0; py.match = null;

  }

  function pyStart(check) {
    py.check = !!check;

  function pyLoadStats() {

  function bars(list) {

  // ---------- Topic navigation ----------

  let topicList = {}; // per language, from getTopics

  function fillTopicPicker(sel) {
    const l = lang();
    const build = data => {
      sel.innerHTML = '';
      const first = document.createElement('option');
      first.textContent = '📋 Choose any topic…';
      first.value = '';
      sel.appendChild(first);
      let group = null;
      data.items.forEach(it => {
        const base = ((it.n - 1) % 100) + 1;
        if (base % 25 === 1) {
          group = document.createElement('optgroup');
          const round = Math.floor((it.n - 1) / 100) + 1;
          group.label = (round > 1 ? 'Round ' + round + ' · ' : '') + 'Stage ' + (Math.floor((base - 1) / 25) + 1);

          ({ review: '🔁 ', milestone: '🏁 ' }[it.kind] || '') + it.n + '. ' + it.title;
        group.appendChild(o);
      });
      sel.onchange = () => { if (sel.value) goToTopic(Number(sel.value)); };

  // ---------- Word help: hover (computer) or tap (phone) any word the tutor wrote ----------

  var wordsOn = true;

  function toggleWords() {

  // Wrap each word of a tutor message in a <span class="w"> (Chinese/Japanese need a word segmenter).
  function wrapWords(el, l) {
    const seg = (window.Intl && Intl.Segmenter) ? new Intl.Segmenter(speechOf(l), { granularity: 'word' }) : null;
    const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(n => {
      const text = n.nodeValue;
      if (!/\p{L}/u.test(text)) return;
      const frag = document.createDocumentFragment();
      const parts = seg
        ? Array.from(seg.segment(text), s => ({ t: s.segment, w: s.isWordLike && /\p{L}/u.test(s.segment) }))
        : text.split(/([\p{L}\p{M}'’]+)/u).map((t, i) => ({ t: t, w: i % 2 === 1 }));
      parts.forEach(p => {
        if (!p.t) return;
        if (p.w) {
          const s = document.createElement('span');
          s.className = 'w';
          s.textContent = p.t;
          frag.appendChild(s);
        } else frag.appendChild(document.createTextNode(p.t));
      });
      n.parentNode.replaceChild(frag, n);
    });
  }

  function tipEl() {
    let t = document.getElementById('wtip');
    if (!t) {

  function hideTip() {
    clearTimeout(tipTimer);
    tipFor = null;
    const t = document.getElementById('wtip');

  }

  function showTip(span, userGesture) {
    const l = lang();
    const word = span.textContent.trim();
    if (!word) return;
    tipFor = span;
    const t = tipEl();
    const r = span.getBoundingClientRect();
    t.style.display = 'block';
    t.style.left = Math.max(8, Math.min(window.innerWidth - 268, r.left + window.scrollX)) + 'px';
    t.style.top = (r.bottom + window.scrollY + 6) + 'px';
    const fill = d => {
      if (tipFor !== span) return;
      t.innerHTML = '';
      const h = document.createElement('div');
      h.className = 'tw';
      h.textContent = (d && d.word) || word;
      if (d && d.reading) { const rd = document.createElement('span'); rd.className = 'tr'; rd.textContent = ' ' + d.reading; h.appendChild(rd); }
      t.appendChild(h);
      const m = document.createElement('div');
      m.textContent = !d ? '…' : d.error ? d.error : (d.meaning || 'Already in your language') + (d.type ? ' (' + d.type + ')' : '');
      t.appendChild(m);
      if (d && d.note) { const nt = document.createElement('div'); nt.className = 'tn'; nt.textContent = d.note; t.appendChild(nt); }
      if (d && d.source) {
        const src = document.createElement('div');
        src.className = 'tn';
        src.textContent = { device: '💻 free on-device translation', dictionary: '📖 from the shared dictionary', ai: '✨ AI lookup — saved for next time', none: '' }[d.source] || '';
        if (d.source === 'device') {
          const more = document.createElement('a');
          more.className = 'more';
          more.textContent = ' · more detail';
          more.href = 'javascript:void 0';
          src.appendChild(more);
        }
        t.appendChild(src);
      }
    };
    const key = l + '|' + helpLang + '|' + word.toLowerCase();
    const msg = span.closest('.msg');
    const full = msg ? msg.textContent : word;
    const at = Math.max(0, full.indexOf(word));
    const sentence = full.slice(Math.max(0, at - 120), at + word.length + 120);
    const fromServer = () => {
      fill(null);
      call('lookupWord', l, word, sentence)
        .then(d => { wordCache.set(key, d || { meaning: '' }); fill(d || { meaning: '' }); })
        .catch(err => fill({ error: err.message }));
    };
    t.onclick = e => { if (e.target.classList.contains('more')) { e.stopPropagation(); fromServer(); } };
    if (wordCache.has(key)) { fill(wordCache.get(key)); return; }
    fill(null);
    // Free first: the browser's own on-device translator (recent desktop Chrome). Otherwise the server,
    // which checks the shared dictionary before it ever pays for an AI lookup.
    deviceTranslate(word, l, userGesture).then(tr => {
      if (tipFor !== span) return;
      if (tr && tr.toLowerCase() !== word.toLowerCase()) {
        const d = { word: word, meaning: tr, source: 'device' };
        wordCache.set(key, d);
        fill(d);
      } else fromServer();
    });
  }

  // Chrome's built-in Translator API runs on the device: free and private. Not on most phones yet.
  const translators = {};
  function deviceTranslate(word, l, gesture) {
    try {
      if (!('Translator' in self)) return Promise.resolve(null);
      const src = speechOf(l).split('-')[0];
      const dst = helpLang === 'en' ? 'en' : ((HELP_LANGS[helpLang] || {}).speech || helpLang).split('-')[0];
      if (src === dst) return Promise.resolve(null);
      const pair = src + '>' + dst;
      if (!translators[pair]) {
        translators[pair] = Translator.availability({ sourceLanguage: src, targetLanguage: dst }).then(a => {
          if (a === 'unavailable' || (a !== 'available' && !gesture)) { delete translators[pair]; return null; }
          return Translator.create({ sourceLanguage: src, targetLanguage: dst }); // a tap may download the language pack once
        }).catch(() => { delete translators[pair]; return null; });
      }
      return translators[pair].then(tr => tr ? tr.translate(word) : null).catch(() => null);
    } catch (e) { return Promise.resolve(null); }
  }

  (function wireWords() {
    const log = document.getElementById('log');
    log.addEventListener('click', e => {
      const w = e.target.closest && e.target.closest('.msg.tutor .w');
      if (!w || !wordsOn) { hideTip(); return; }
      e.stopPropagation(); // don't replay the whole message
      showTip(w, true);
      if ('speechSynthesis' in window && window.SpeechSynthesisUtterance) { // say the word
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(w.textContent);
        u.lang = speechOf(lang());
        const v = pickVoice(lang()); if (v) u.voice = v;
        u.rate = 0.8;
        speechSynthesis.speak(u);
      }
    }, true);
    log.addEventListener('pointerover', e => {
      if (e.pointerType !== 'mouse' || !wordsOn) return;
      const w = e.target.closest && e.target.closest('.msg.tutor .w');
      clearTimeout(tipTimer);
      if (w) tipTimer = setTimeout(() => showTip(w), 350);
    });
    log.addEventListener('pointerout', e => {
      if (e.pointerType !== 'mouse') return;
      const w = e.target.closest && e.target.closest('.w');
      if (w) { clearTimeout(tipTimer); setTimeout(() => { if (tipFor === w) hideTip(); }, 900); }

      const t = document.createElement('div');
      t.className = 'resume';
      t.textContent = '✍ Your own topic: ' + st.custom;
      log.appendChild(t);
    }
    if (st.resumedAt) {
      const b = document.createElement('div');
      b.className = 'resume';
      const when = new Date(st.resumedAt);
      b.innerHTML = '↩ Continuing your session from ' + when.toLocaleDateString() + ' ' +
        when.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + ' ';
      const fresh = document.createElement('button');
      fresh.className = 'redo';
      fresh.textContent = 'Start fresh';
      fresh.onclick = () => { if (confirm('Discard this session and start again?')) resetSession(); };
      b.appendChild(fresh);
      log.appendChild(b);
    }
    view.forEach((m, i) => {
      const d = document.createElement('div');
      d.className = 'msg ' + m.who + (m.q ? ' q' : '');
      if (m.who === 'cele') d.className = 'msg cele';
      if (m.who === 'tutor') { d.innerHTML = richText(m.text); if (wordsOn && m.text !== '…') wrapWords(d, lang()); }
      else d.textContent = m.text;
      if (m.img) {
        const im = document.createElement('img');
        im.src = m.img;
        d.appendChild(im);
      }
      if (m.who === 'tutor') d.onclick = () => speak(m.text, lang(), true);
      if (m.who === 'err' && m.retry && i === view.length - 1) {
        const b = document.createElement('button');
        b.className = 'redo';
        b.style.marginLeft = '8px';
        b.textContent = '↻ Retry';
        b.onclick = () => retryLast(m);
        d.appendChild(b);
      }
      log.appendChild(d);

      if (m.who === 'tutor' && m.model) {
        const meta = document.createElement('div');
        meta.className = 'meta';
        const tag = document.createElement('span');
        if (m.model === 'sonnet') {
          tag.className = 'sonnet';
          tag.textContent = (m.escalated === 'your question' ? '🙋 Sonnet answered your question' : m.escalated ? '⬆ Sonnet — ' + m.escalated : 'Sonnet') + (m.secs ? ' · ' + m.secs + 's' : '');
        } else {
          tag.textContent = 'Haiku' + (m.secs ? ' · ' + m.secs + 's' : '');
        }
        meta.appendChild(tag);
        if (m.model === 'haiku' && i === view.length - 1) {
          const b = document.createElement('button');
          b.className = 'redo';
          b.textContent = 'Redo with Sonnet';
          b.onclick = redoWithSonnet;
          meta.appendChild(b);
        }
        log.appendChild(meta);
      }
    });
    if (skill === 'guided' && phase[lang()] === 7 && view.length && view[view.length - 1].who === 'tutor' && view[view.length - 1].text !== '…') {
      const done = document.createElement('div');
      done.className = 'welcome';
      done.innerHTML = '<h3>' + (completed[lang()] ? '✅ Session complete' : '🏁 Wrap-up') + '</h3>' +
        '<div class="sub">' + (completed[lang()]
          ? 'Your progress is saved. Ready for the next one?'
          : 'Answer the speaking challenge, or finish now and save this session.') + '</div>';
      const b = document.createElement('button');
      b.className = 'go';
      b.style.marginTop = '10px';
      b.textContent = completed[lang()] ? '▶ Next session' : '✔ Finish & go to next session';
      b.onclick = nextSession;
      done.appendChild(b);
      log.appendChild(done);
    }
    log.scrollTop = log.scrollHeight;
  }

  function resetSession() {
    speechSynthesis.cancel();
    rateFactor = 1;
    state[lang()] = { messages: [], view: [], skill: skill };
    phase[lang()] = 0;
    testTask[lang()] = 0;
    completed[lang()] = false;
    saveLocal(lang());
    renderPhases();
    render();
  }

  // "pinyin", "tones", "pronunciation" in Chinese → the pinyin trainer, not a chat lesson
  // Make sure the language on screen is the one the card was built for (guards against late page updates).
  function keepLang(l) {
    if (l && lang() !== l && myLangs.indexOf(l) >= 0) { document.getElementById('lang').value = l; onLangChange(); }
  }

  function wantsPinyin(topic) { return /pinyin|拼音|声调|\btones?\b|pronunciation|发音/i.test(topic); }

  function openPinyin() {
    if (myLangs.indexOf('zh') < 0) {
      alert('The 🎯 Pinyin & tones trainer is part of Mandarin. Add Mandarin under 🌐 Languages… first.');
      return false;
    }
    if (lang() !== 'zh') { document.getElementById('lang').value = 'zh'; onLangChange(); }
    document.getElementById('skill').value = 'pinyin';
    onSkillChange();
    return true;
  }

  function startCustom(topic) {
    const l = lang();
    if (/pinyin|拼音/i.test(topic) && l !== 'zh') {
      if (confirm('Pinyin is the spelling system for Mandarin Chinese. Open the 🎯 Pinyin & tones trainer for Mandarin instead?')) { if (openPinyin()) return; }
      else return;
    }
    if (l === 'zh' && wantsPinyin(topic)) { openPinyin(); return; }
    resetSession();
    const s = state[l];
    s.custom = topic;
    if (plan[l] && plan[l].custom) plan[l].custom.active = topic;
    // remember it on the server (continues on any device), then start
    call('setCustomTopic', l, levels[l], topic)
      .catch(() => {})
      .then(() => sendText("Let's start guided practice on my own topic: " + topic));
  }

  function leaveCustom() {
    const l = lang();
    plan[l] = null;
    render();
    call('leaveCustomTopic', l, levels[l]).then(p => { plan[l] = p; render(); }).catch(err => { showApiError(err); loadPlan(); });
  }

  function startSession(topic) {
    if (typeof topic !== 'string') topic = ''; // called from a button click
    resetSession();
    const act = document.getElementById('activity').value;
    if (skill === 'test') { startTest(); return; }
    sendText(skill === 'guided'
      ? "Let's start today's guided practice."
      : "Let's start today's " + skill + " session." + (act ? ' Activity: ' + act + '.' : '') +
        (topic ? ' Topic: ' + topic + ' — keep the whole session about this topic.' : ''));
  }

  // End of a guided session → save it (if the tutor didn't already) and show the next topic's card.
  function nextSession() {
    const l = lang();
    const ownTopic = state[l].custom || '';
    const go = () => {
      if (ownTopic) { startCustom(ownTopic); plan[l] = null; loadPlan(); return; } // your topic never ends
      resetSession();
      plan[l] = null;
      topicList[l] = null;
      loadPlan();
    };
    if (completed[l]) { Promise.resolve(pendingSave[l]).then(go, go); return; }
    setBusy(true);
    call('finishSession', l, levels[l], 'Finished from the wrap-up button.', state[l].custom || '')
      .then(() => { setBusy(false); go(); celebrateSession(l); })
      .catch(err => { setBusy(false); showApiError(err); });
  }

  // ---------- Ask the tutor ----------
  // 🙋 makes the NEXT message (typed or spoken, in English or the target language) a side question.
  var askNext = false;

  function setAsk(on) {
    askNext = on;
    const chip = document.getElementById('askChip');
    if (chip) { chip.classList.toggle('on', on); chip.textContent = on ? '🙋 Asking… (tap to cancel)' : '🙋 Ask'; }
    const box = document.getElementById('input');
    if (on) { box.placeholder = 'Ask about the language — English is fine (type, or use 🎤)'; box.focus(); }
    else idleMicHint();
  }

  // How a learner message is shown in the chat
  function displayText(text) {
    return text.replace(/^\[question\]\s*/, '🙋 ').replace(/^\[voice\]\s*/, '🎤 ').replace(/^\[finish test\]\s*/, '🏁 ');
  }

  function quick(text) {
    if (text === '__topic') { // back to the welcome card, where you choose a topic
      const s = state[lang()];
      if (s.messages.length && !confirm('Choose a new topic? This ends the current session.')) return;
      resetSession();
      const box = document.querySelector('.chooser');
      if (box) { box.scrollIntoView({ behavior: 'smooth', block: 'start' }); box.classList.add('flash'); }
      return;
    }
    if (text === '__ask') {
      if (!state[lang()].messages.length) { alert('Start a session first, then tap 🙋 Ask any time.'); return; }
      setAsk(!askNext);
      return;
    }
    if (text === '__finishtest') {
      if (!state[lang()].messages.length) { startTest(); return; }
      if (document.getElementById('sendBtn').disabled) return;
      if (confirm('Finish now and score the test? Tasks you have not answered score 0.')) finishTest();
      return;
    }
    if (text === '__faster') { // only changes the playback speed
      rateFactor = Math.min(1.6, rateFactor + 0.15);
      const v = state[lang()].view;
      for (let i = v.length - 1; i >= 0; i--) if (v[i].who === 'tutor') { speak(v[i].text, lang(), true); break; }
      return;
    }
    if (document.getElementById('sendBtn').disabled) return;
    if (!state[lang()].messages.length) { startSession(); return; }
    if (text === 'Next' && skill === 'guided' && completed[lang()]) { nextSession(); return; }
    if (text === 'Slower please') rateFactor = Math.max(0.6, rateFactor - 0.1); // slow the voice too
    sendText(text);
  }

  function send() {
    const box = document.getElementById('input');
    const text = box.value.trim();
    if (!text) return;
    box.value = '';
    sendText(text);
  }

  function sendText(text) {
    const s = state[lang()];
    if (askNext) {
      text = '[question] ' + text.replace(/^\[voice\]\s*/, '');
      setAsk(false);
    }
    s.messages.push({ role: 'user', content: text });
    s.view.push({ who: 'me', text: displayText(text), q: /^\[question\]/.test(text) });
    runTurn(lang(), mode);
  }

  // A message the learner sent (text or image) — not a tool result.
  function isHumanTurn(m) {
    if (m.role !== 'user') return false;
    if (typeof m.content === 'string') return true;
    return Array.isArray(m.content) && !m.content.some(b => b.type === 'tool_result');
  }

  // Keep only the newest handwriting image in what we send, so old images don't cost tokens every turn.
  function payloadMessages(msgs) {
    let keptOne = false;
    const out = [];
    for (let i = msgs.length - 1; i >= 0; i--) {
      const m = msgs[i];
      if (isHumanTurn(m) && Array.isArray(m.content) && m.content.some(b => b.type === 'image')) {
        if (keptOne) {
          const txt = m.content.filter(b => b.type === 'text').map(b => b.text).join(' ');
          out.unshift({ role: 'user', content: txt + ' (earlier image removed)' });
          continue;
        }
        keptOne = true;
      }
      out.unshift(m);
    }
    return out;
  }

  function runTurn(l, useMode, retried) {
    const s = state[l];
    s.view.push({ who: 'tutor', text: '…' });
    render();
    setBusy(true);

    const sent = payloadMessages(s.messages);
    const t0 = Date.now();
    call('chat', l, levels[l], useMode, skill, sent, s.custom || '')
      .then(res => {
        // Server returns the history it was sent plus the new turns; append only the new part.
        let shown = takePhase(res.text || '', l);
        if (!shown.trim() && !retried) { // empty reply: ask again once (Sonnet if allowed)
          s.view.pop(); setBusy(false);
          runTurn(l, (!me || me.allowSonnet !== false) ? 'sonnet' : 'haiku', true);
          return;
        }
        if (!shown.trim()) shown = '(The tutor sent an empty reply. Tap ↻ or type "Say it again".)';
        const added = res.messages.slice(sent.length);
        s.messages = s.messages.concat(added);
        let testDone = false;
        if (s.skill === 'test' || skill === 'test') { const t = takeTask(shown, l); shown = t.text; testDone = t.done; }
        const justCompleted = !!(res.log && res.log.complete) && !completed[l];
        if (res.log && res.log.complete) completed[l] = true;
        s.view[s.view.length - 1] = { who: 'tutor', text: shown, model: res.model, escalated: res.escalated,
          secs: ((Date.now() - t0) / 1000).toFixed(1) };
        setBusy(false);
        render();
        speak(shown, l, false); // speak first — saving happens in the background below
        saveLocal(l);
        if (me && !me.isOwner) {
          me.usedToday += 1;
          document.getElementById('who').textContent = '👤 ' + me.name + ' · ' + me.usedToday + '/' + me.limit + ' today';
        }
        const wrapUp = phase[l] === 7;
        const refreshPlan = () => { if (wrapUp) { plan[l] = null; topicList[l] = null; call('getTodayPlan', l, levels[l]).then(p => { plan[l] = p; }).catch(() => {}); } };
        if (res.log) pendingSave[l] = call('saveLog', l, levels[l], res.log, s.custom || '').then(r => {
          refreshPlan();
          if (r && r.test) celebrateTest(l, r.test);
          else if (justCompleted) celebrateSession(l);
          else loadSummary(l);
        }).catch(() => {});
        else refreshPlan();
        if (testDone) setTimeout(() => { if (lang() === l && !document.getElementById('sendBtn').disabled) sendText('[finish test] Please score my test now.'); }, 1200);
      })
      .catch(err => {
        // Drop the learner's unanswered turn so history stays valid, but keep it for ↻ Retry
        let failed = null;
        if (s.messages.length && isHumanTurn(s.messages[s.messages.length - 1])) failed = s.messages.pop();
        s.view[s.view.length - 1] = { who: 'err', text: 'Error: ' + err.message, retry: failed, mode: useMode };
        setBusy(false);
        render();
      });
  }

  // Resend the message that failed (same text, no retyping).
  function retryLast(m) {
    const l = lang();
    const s = state[l];
    if (document.getElementById('sendBtn').disabled) return;
    s.view.pop();               // the error bubble; the learner's bubble stays
    s.messages.push(m.retry);
    runTurn(l, m.mode || mode);
  }

  function redoWithSonnet(e) {
    if (e) e.stopPropagation();
    const l = lang();
    const s = state[l];
    let idx = -1;
    for (let i = s.messages.length - 1; i >= 0; i--) {
      if (isHumanTurn(s.messages[i])) { idx = i; break; }
    }
    if (idx < 0) return;
    s.messages = s.messages.slice(0, idx + 1);
    s.view.pop();
    speechSynthesis.cancel();
    runTurn(l, 'sonnet');
  }

  function setBusy(b) {
    document.getElementById('sendBtn').disabled = b;
    document.getElementById('mic').disabled = b;
  }

  // ---------- Handwriting pad ----------

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let drawing = false, hasInk = false;

  function sizeCanvas() {
    const r = canvas.getBoundingClientRect();
    if (!r.width) return;
    canvas.width = Math.round(r.width * 2);
    canvas.height = Math.round(r.height * 2);
    ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111';
    hasInk = false;
  }

  function togglePad() {
    const pad = document.getElementById('pad');
    pad.classList.toggle('open');
    if (pad.classList.contains('open')) sizeCanvas();
  }

  function pos(e) {
    const r = canvas.getBoundingClientRect();
    return [(e.clientX - r.left) * canvas.width / r.width, (e.clientY - r.top) * canvas.height / r.height];
  }

  canvas.addEventListener('pointerdown', e => {
    drawing = true; canvas.setPointerCapture(e.pointerId);
    const [x, y] = pos(e); ctx.beginPath(); ctx.moveTo(x, y);
  });
  canvas.addEventListener('pointermove', e => {
    if (!drawing) return;
    const [x, y] = pos(e); ctx.lineTo(x, y); ctx.stroke(); hasInk = true;
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => canvas.addEventListener(t, () => { drawing = false; }));

  function clearPad() { ctx.clearRect(0, 0, canvas.width, canvas.height); hasInk = false; }

  // Flatten onto white and return a data URL (the canvas is transparent by default).
  function padImage() {
    const c = document.createElement('canvas');
    c.width = canvas.width; c.height = canvas.height;
    const x = c.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
    x.drawImage(canvas, 0, 0);
    return c.toDataURL('image/png');
  }

  function sendDrawing() {
    if (!hasInk) { alert('Write something on the pad first.'); return; }
    if (document.getElementById('sendBtn').disabled) return;
    sendImage(padImage(), 'image/png');
    clearPad();
  }

  function sendPhoto(input) {
    const file = input.files && input.files[0];
    input.value = '';
    if (!file) return;
    const img = new Image();
    const reader = new FileReader();
    reader.onload = () => {
      img.onload = () => {
        // Shrink to max 1000px so the image stays cheap in tokens
        const scale = Math.min(1, 1000 / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        sendImage(c.toDataURL('image/jpeg', 0.8), 'image/jpeg');
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  function sendImage(dataUrl, mediaType) {
    const box = document.getElementById('input');
    const note = box.value.trim();
    box.value = '';
    const text = '[handwriting] ' + (note || 'Here is what I wrote. Please check it.');
    const s = state[lang()];
    s.messages.push({ role: 'user', content: [
      { type: 'image', source: { type: 'base64', media_type: mediaType, data: dataUrl.split(',')[1] } },
      { type: 'text', text: text }
    ]});
    s.view.push({ who: 'me', text: note || '✏️ Handwriting', img: dataUrl });
    runTurn(lang(), mode);
  }

  // ---------- Text-to-speech ----------

  function toggleSpeak() {
    speakOn = !speakOn;
    document.getElementById('spk').textContent = speakOn ? '🔊 On' : '🔇 Off';
    if (!speakOn) speechSynthesis.cancel();
  }

  function pickVoice(l) {
    const voices = speechSynthesis.getVoices();
    for (const p of voicePrefs(l)) {
      const v = voices.find(v => v.lang.replace('_', '-').startsWith(p));
      if (v) return v;
    }
    return null;
  }

  function speak(text, l, force) {
    if (!('speechSynthesis' in window)) return;
    if (!speakOn && !force) return;
    const parts = [...text.matchAll(/«([^»]+)»/g)].map(m => m[1].trim()).filter(Boolean);
    if (!parts.length) return;
    speechSynthesis.cancel();
    const voice = pickVoice(l);
    parts.forEach(p => {
      const u = new SpeechSynthesisUtterance(p);
      u.lang = speechOf(l);
      if (voice) u.voice = voice;
      u.rate = ({ zh: 0.75, es: 0.9, de: 0.85 }[l] || 0.9) * rateFactor; // slower for tones / long words
      speechSynthesis.speak(u);
    });
  }

  if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};

  // ---------- Microphone permission ----------

  let micReady = false;
  const FALLBACK = ' You can still speak: tap the 🎤 key on your phone keyboard while typing in the box.';

  function micBanner(text, showButton) {
    document.getElementById('micText').textContent = text;
    document.getElementById('micAllow').style.display = showButton ? '' : 'none';
    document.getElementById('micBanner').classList.add('show');
  }
  function hideMicBanner() { document.getElementById('micBanner').classList.remove('show'); }

  // The page is blocked from the mic entirely (e.g. the hosting frame doesn't allow it).
  function micBlockedByPage() {
    const fp = document.permissionsPolicy || document.featurePolicy;
    return !!(fp && fp.allowsFeature && !fp.allowsFeature('microphone'));
  }

  // Check on load and show the banner if permission hasn't been given yet.
  async function checkMic() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      micBanner('This browser can\'t use the microphone here. Open the tutor link in Chrome.' + FALLBACK, false);
      return;
    }
    if (micBlockedByPage()) {
      micBanner('The microphone is blocked inside this window.' + FALLBACK, false);
      return;
    }
    try {
      const st = await navigator.permissions.query({ name: 'microphone' });
      const apply = () => {
        if (st.state === 'granted') { micReady = true; hideMicBanner(); }
        else if (st.state === 'denied') {
          micReady = false;
          micBanner('Microphone is turned off for this site. Tap the 🔒 icon next to the address bar → Permissions → Microphone → Allow, then reload.' + FALLBACK, false);
        } else { micReady = false; micBanner('🎤 Allow the microphone so you can answer out loud.', true); }
      };
      apply();
      st.onchange = apply;
    } catch (e) {
      // Permissions API not supported (some Safari versions): just offer the button.
      micBanner('🎤 Allow the microphone so you can answer out loud.', true);
    }
  }

  // Ask the browser for the mic. This makes Chrome show its "Allow" pop-up.
  async function requestMic() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      stream.getTracks().forEach(t => t.stop()); // we only needed the permission
      micReady = true;
      hideMicBanner();
      return true;
    } catch (e) {
      micReady = false;
      if (e.name === 'NotAllowedError' || e.name === 'SecurityError') {
        micBanner(micBlockedByPage()
          ? 'The microphone is blocked inside this window.' + FALLBACK
          : 'Microphone was not allowed. Tap the 🔒 icon next to the address bar → Permissions → Microphone → Allow, then reload.' + FALLBACK, false);
      } else if (e.name === 'NotFoundError') {
        micBanner('No microphone found on this device.' + FALLBACK, false);
      } else {
        micBanner('Couldn\'t start the microphone (' + e.name + ').' + FALLBACK, false);
      }
      return false;
    }
  }

  checkMic();

  // ---------- Speech-to-text ----------

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  // ---------- Listening ----------
  // Keeps listening through short thinking pauses, and only sends after the pause you choose
  // (⏱ menu next to the mic), or straight away when you tap ⏹.

  const NOTHING_HEARD_MS = 10000; // give up if you say nothing at all for this long
  var rec = null; // var (not let): read by start-up code that runs before this line

  function pauseSetting() {
    try { const s = localStorage.getItem('tutorPause'); if (s !== null) return s; } catch (e) {}
    return '3000';
  }

  function holdMode() { return pauseSetting() === 'hold'; }

  function pauseMs() {
    if (holdMode()) return 0;
    const v = Number(pauseSetting());
    return Number.isFinite(v) ? v : 3000;
  }

  function onPauseChange() {
    const v = document.getElementById('pause').value;
    try { localStorage.setItem('tutorPause', v); } catch (e) {}
    idleMicHint();
  }

  function idleMicHint() {
    if (rec) return;
    document.getElementById('input').placeholder = holdMode() ? 'Hold 🎤 while you speak, release to send — or type…' : 'Type or speak…';
    document.getElementById('mic').title = holdMode() ? 'Hold to talk, release to send' : 'Tap to talk';
  }

  // Tap mode: a click starts / stops. Hold mode: press starts, release sends.
  var holding = false;
  (function wireMic() {
    const b = document.getElementById('mic');
    b.addEventListener('click', () => { if (!holdMode()) listen(false); });
    b.addEventListener('pointerdown', e => {
      if (!holdMode() || b.disabled) return;
      e.preventDefault();
      try { b.setPointerCapture(e.pointerId); } catch (x) {}
      holding = true;
      listen(true);
    });
    const release = () => {
      if (!holding) return;
      holding = false;
      if (rec) rec.stopNow();
    };
    b.addEventListener('pointerup', release);
    b.addEventListener('pointercancel', release);
    b.addEventListener('contextmenu', e => e.preventDefault());
  })();

  // Joins recognition results. Some Android phones repeat the whole phrase in every result,
  // so a result that already contains the text so far replaces it instead of being added.
  function joinResults(results) {
    let out = '';
    for (let i = 0; i < results.length; i++) {
      const t = String(results[i][0].transcript || '').trim();
      if (!t) continue;
      const a = out.toLowerCase(), b = t.toLowerCase();
      if (out && b.startsWith(a)) out = t;
      else if (out && a.endsWith(b)) continue;
      else out = out ? out + ' ' + t : t;
    }
    return out;
  }

  async function listen(hold) {
    if (rec) { if (!hold) rec.stopNow(); return; } // tap ⏹ = send now
    if (!SR) {
      alert('Speech recognition is not available in this browser. Use Chrome, or the mic key on your phone keyboard.');
      return;
    }
    if (!micReady) {
      const ok = await requestMic(); // first use asks for permission automatically
      if (!ok) return;
      if (hold) { holding = false; document.getElementById('input').placeholder = 'Microphone allowed — now hold 🎤 while you speak'; return; }
    }
    if (hold && !holding) return; // released before listening could start
    speechSynthesis.cancel();

    const mic = document.getElementById('mic');
    const box = document.getElementById('input');
    const wait = pauseMs();               // 0 = only send when ⏹ is tapped
    const asking = askNext;
    const oldPlaceholder = box.placeholder;
    let committed = '', current = '', gotResult = false, stopping = false, done = false;
    let timer = null, restarts = 0, r = null;

    const text = () => (committed + ' ' + current).trim();
    const show = () => { box.value = text(); };

    const armTimer = () => {
      clearTimeout(timer);
      if (wait > 0) timer = setTimeout(stopNow, wait);
    };

    function stopNow() {
      stopping = true;
      clearTimeout(timer);
      try { r.stop(); } catch (e) { finish(); }
    }

    function finish() {
      if (done) return;
      done = true;
      clearTimeout(timer);
      rec = null;
      mic.classList.remove('listening');
      mic.textContent = '🎤';
      box.placeholder = oldPlaceholder;
      idleMicHint();
      const t = gotResult ? text() : '';
      if (hold && !t) box.placeholder = 'Didn\'t catch anything — keep holding 🎤 while you speak';
      if (gotResult) box.value = '';
      if (t) sendText('[voice] ' + t);
    }

    function begin() {
      r = new SR();
      r.lang = asking ? helpSpeech() : speechOf(lang()); // questions are asked in your explanation language
      r.interimResults = true;  // show words as you speak
      r.continuous = true;      // don't stop at the first pause
      r.maxAlternatives = 1;

      r.onresult = e => {
        gotResult = true;
        current = joinResults(e.results);
        show();
        armTimer();             // the pause countdown restarts every time you speak
      };
      r.onerror = e => {
        if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
          micReady = false;
          stopping = true;
          checkMic();
          return;
        }
        if (e.error === 'aborted') return;
        if (e.error === 'no-speech' && gotResult) return; // just a long pause: keep going
        stopping = true;
        if (!gotResult) {
          const msg = e.error === 'no-speech'
            ? 'Didn\'t hear anything. Tap 🎤 and speak when you\'re ready.'
            : 'Didn\'t catch that (' + e.error + '). Try again.';
          state[lang()].view.push({ who: 'err', text: msg });
          render();
        }
      };
      // Browsers end listening by themselves now and then; restart quietly unless we meant to stop.
      r.onend = () => {
        committed = text();
        current = '';
        if (!stopping && !done && restarts < 30) {
          restarts += 1;
          try { begin(); return; } catch (e) {}
        }
        finish();
      };
      r.start();
    }

    rec = { stopNow: stopNow };
    mic.classList.add('listening');
    mic.textContent = hold ? '🔴' : '⏹';
    box.placeholder = hold ? 'Listening… release to send' : wait > 0
      ? 'Listening… pause ' + (wait / 1000) + 's or tap ⏹ to send'
      : 'Listening… tap ⏹ when you finish';
    begin();
    clearTimeout(timer);
    if (!hold) timer = setTimeout(() => { if (!gotResult) stopNow(); }, NOTHING_HEARD_MS);
  }
</script>
</body>
</html>
