  // How a learner message is shown in the chat
  function displayText(text) {
    return text.replace(/^\[question\]\s*/, '🙋 ').replace(/^\[voice\]\s*/, '🎤 ').replace(/^\[finish test\]\s*/, '🏁 ');
  }

  function quick(text) {
    if (text === '__topic') { // back to the welcome card, where you choose a topic
      const s = state[lang()];
      if (s.messages.length && !confirm('Choose a new topic? This ends the current session.')) return;
      resetSession();
      const box = document.querySelector('.chooser');
      if (box) { box.scrollIntoView({ behavior: 'smooth', block: 'start' }); box.classList.add('flash'); }
      return;
    }
    if (text === '__ask') {
      if (!state[lang()].messages.length) { alert('Start a session first, then tap 🙋 Ask any time.'); return; }
      setAsk(!askNext);
      return;
    }
    if (text === '__finishtest') {
      if (!state[lang()].messages.length) { startTest(); return; }
      if (document.getElementById('sendBtn').disabled) return;
      if (confirm('Finish now and score the test? Tasks you have not answered score 0.')) finishTest();
      return;
    }
    if (text === '__faster') { // only changes the playback speed
      rateFactor = Math.min(1.6, rateFactor + 0.15);
      const v = state[lang()].view;
      for (let i = v.length - 1; i >= 0; i--) if (v[i].who === 'tutor') { speak(v[i].text, lang(), true); break; }
      return;
    }
    if (document.getElementById('sendBtn').disabled) return;
    if (!state[lang()].messages.length) { startSession(); return; }
    if (text === 'Next' && skill === 'guided' && completed[lang()]) { nextSession(); return; }
    if (text === 'Slower please') rateFactor = Math.max(0.6, rateFactor - 0.1); // slow the voice too
    sendText(text);
  }

  function send() {
    const box = document.getElementById('input');
    const text = box.value.trim();
    if (!text) return;
    box.value = '';
    box.style.height = '40px';
    sendText(text);
  }

  // ---------- "Did I say it right?" — free check of a spoken repeat against the tutor's « » sentence ----------
  const normW = w => w.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^\p{L}\p{N}']/gu, '');
  function pronCheck(heard, l) {
    const v = state[l].view;
    let tutor = null;
    for (let i = v.length - 1; i >= 0; i--) if (v[i].who === 'tutor' && v[i].text !== '…') { tutor = v[i].text; break; }
    if (!tutor) return null;
    const targets = [...tutor.matchAll(/«([^»]+)»/g)].map(m => m[1].trim()).filter(Boolean);
    if (!targets.length) return null;
    if (l === 'zh') {
      if (!window.pinyinPro) return null;
      let best = null;
      targets.forEach(t => { if (!sylls(t).length) return; const g = bestGrade(t, [heard]); if (!best || g.score > best.g.score) best = { t: t, g: g }; });
      if (!best || best.g.score < 0.45) return null; // you answered rather than repeated
      return { zh: true, target: best.t, sylls: best.g.sylls.map(r => ({ ch: r.ch, ok: r.okI && r.okF && r.okT, tone: r.okI && r.okF && !r.okT,
        heard: r.heard ? pinyinPro.convert((r.heard.i + r.heard.f).replace(/^([jqxy])ü/, '$1u') + (r.heard.t || ''), { format: 'numToSymbol' }) : '' })),
        score: Math.round(100 * best.g.score) };
    }
    // other languages: word-by-word (longest common subsequence)
    const H = heard.split(/\s+/).map(normW).filter(Boolean);
    let best = null;
    targets.forEach(t => {
      const words = t.split(/\s+/).filter(w => normW(w));
      const T = words.map(normW);
      const n = T.length, m = H.length, L = [];
      for (let i = 0; i <= n; i++) { L[i] = []; for (let j = 0; j <= m; j++) L[i][j] = !i || !j ? 0 : T[i - 1] === H[j - 1] ? L[i - 1][j - 1] + 1 : Math.max(L[i - 1][j], L[i][j - 1]); }
      const ok = new Array(n).fill(false);
      for (let i = n, j = m; i > 0 && j > 0;) { if (T[i - 1] === H[j - 1]) { ok[i - 1] = true; i--; j--; } else if (L[i - 1][j] >= L[i][j - 1]) i--; else j--; }
      const sc = n ? L[n][m] / n : 0;
      // which matched words differ only by an accent (stress) mark?
      const exact = w => w.toLowerCase().replace(/[^\p{L}\p{N}']/gu, '');
      const Hx = heard.split(/\s+/).map(exact).filter(Boolean);
      const acc = words.map((w, i) => ok[i] && Hx.indexOf(exact(w)) < 0 && exact(w) !== normW(w));
      if (!best || sc > best.score) best = { words: words, ok: ok, acc: acc, score: sc };
    });
    if (!best || best.score < 0.5 || best.words.length < 2) return null; // an answer in your own words, not a repeat
    return { words: best.words.map((w, i) => ({ w: w, ok: best.ok[i] && !best.acc[i], acc: best.acc[i] })), score: Math.round(100 * best.score) };
  }
  function pronHtml(p) {
    const all = p.zh ? p.sylls.every(x => x.ok) : p.words.every(x => x.ok);
    if (!p.zh) p.score = Math.round(100 * p.words.filter(x => x.ok).length / p.words.length);
    const body = p.zh
      ? p.sylls.map(x => '<span class="pw ' + (x.ok ? 'ok' : x.tone ? 'tone' : 'bad') + '" title="' + (x.ok ? 'clear' : 'heard ' + escapeHtml(x.heard || '—')) + '">' +
          escapeHtml(x.ch) + '<small>' + escapeHtml((marked(x.ch)[0] || '')) + (x.ok ? '' : ' → ' + escapeHtml(x.heard || '—')) + '</small></span>').join('')
      : p.words.map(x => '<span class="pw ' + (x.ok ? 'ok' : x.acc ? 'tone' : 'bad') + '"' + (x.acc ? ' title="stress / accent sounded different"' : '') + '>' + escapeHtml(x.w) + '</span>').join(' ');
    return '<div class="pron"><b>' + (all ? '🗣 Clear! ' : '🗣 ' + p.score + '% clear — ') + '</b>' +
      (all ? '' : '<span class="sub">' + (p.zh ? 'orange = tone, red = sound' : 'red = not heard clearly, orange = stress/accent — try those again') + '</span><br>') + body + '</div>';
  }

  function sendText(text) {
    const s = state[lang()];
    if (askNext) {
      text = '[question] ' + text.replace(/^\[voice\]\s*/, '');
      setAsk(false);
    }
    s.messages.push({ role: 'user', content: text });
    const item = { who: 'me', text: displayText(text), q: /^\[question\]/.test(text) };
    if (/^\[voice\]/.test(text)) { try { item.pron = pronCheck(text.replace(/^\[voice\]\s*/, ''), lang()); } catch (e) {} }
    s.view.push(item);
    runTurn(lang(), mode);
  }

  // A message the learner sent (text or image) — not a tool result.
  function isHumanTurn(m) {
    if (m.role !== 'user') return false;
    if (typeof m.content === 'string') return true;
    return Array.isArray(m.content) && !m.content.some(b => b.type === 'tool_result');
  }

  // Keep only the newest handwriting image in what we send, so old images don't cost tokens every turn.
  function payloadMessages(msgs) {
    let keptOne = false;
    const out = [];
    for (let i = msgs.length - 1; i >= 0; i--) {
      const m = msgs[i];
      if (isHumanTurn(m) && Array.isArray(m.content) && m.content.some(b => b.type === 'image')) {
        if (keptOne) {
          const txt = m.content.filter(b => b.type === 'text').map(b => b.text).join(' ');
          out.unshift({ role: 'user', content: txt + ' (earlier image removed)' });
          continue;
        }
        keptOne = true;
      }
      out.unshift(m);
    }
    return out;
  }

  function runTurn(l, useMode, retried) {
    const s = state[l];
    s.view.push({ who: 'tutor', text: '…' });
    render();
    setBusy(true);

    const sent = payloadMessages(s.messages);
    const t0 = Date.now();
    call('chat', l, levels[l], useMode, skill, sent, s.custom || '')
      .then(res => {
        // Server returns the history it was sent plus the new turns; append only the new part.
        let shown = takePhase(res.text || '', l);
        if (!shown.trim() && !retried) { // empty reply: ask again once (Sonnet if allowed)
          s.view.pop(); setBusy(false);
          runTurn(l, (!me || me.allowSonnet !== false) ? 'sonnet' : 'haiku', true);
          return;
        }
        if (!shown.trim()) shown = '(The tutor sent an empty reply. Tap ↻ or type "Say it again".)';
        const added = res.messages.slice(sent.length);
        s.messages = s.messages.concat(added);
        let testDone = false;
        if (s.skill === 'test' || skill === 'test') { const t = takeTask(shown, l); shown = t.text; testDone = t.done; }
        const justCompleted = !!(res.log && res.log.complete) && !completed[l];
        if (res.log && res.log.complete) completed[l] = true;
        s.view[s.view.length - 1] = { who: 'tutor', text: shown, model: res.model, escalated: res.escalated,
          secs: ((Date.now() - t0) / 1000).toFixed(1) };
        setBusy(false);
        render();
        speak(shown, l, false); // speak first — saving happens in the background below
        saveLocal(l);
        if (me && !me.isOwner) {
          me.usedToday += 1;
          document.getElementById('who').textContent = '👤 ' + me.name + ' · ' + me.usedToday + '/' + me.limit + ' today';
        }
        const wrapUp = phase[l] === 7;
        const refreshPlan = () => { if (wrapUp) { plan[l] = null; topicList[l] = null; call('getTodayPlan', l, levels[l]).then(p => { plan[l] = p; }).catch(() => {}); } };
        if (res.log) pendingSave[l] = call('saveLog', l, levels[l], res.log, s.custom || '').then(r => {
          refreshPlan();
          if (r && r.test) celebrateTest(l, r.test);
          else if (justCompleted) celebrateSession(l);
          else loadSummary(l);
        }).catch(() => {});
        else refreshPlan();
        if (testDone) setTimeout(() => { if (lang() === l && !document.getElementById('sendBtn').disabled) sendText('[finish test] Please score my test now.'); }, 1200);
      })
      .catch(err => {
        // Drop the learner's unanswered turn so history stays valid, but keep it for ↻ Retry
        let failed = null;
        if (s.messages.length && isHumanTurn(s.messages[s.messages.length - 1])) failed = s.messages.pop();
        s.view[s.view.length - 1] = { who: 'err', text: 'Error: ' + err.message, retry: failed, mode: useMode };
        setBusy(false);
        render();
      });
  }

  // Resend the message that failed (same text, no retyping).
  function retryLast(m) {
    const l = lang();
    const s = state[l];
    if (document.getElementById('sendBtn').disabled) return;
    s.view.pop();               // the error bubble; the learner's bubble stays
    s.messages.push(m.retry);
    runTurn(l, m.mode || mode);
  }

  function redoWithSonnet(e) {
    if (e) e.stopPropagation();
    const l = lang();
    const s = state[l];
    let idx = -1;
    for (let i = s.messages.length - 1; i >= 0; i--) {
      if (isHumanTurn(s.messages[i])) { idx = i; break; }
    }
    if (idx < 0) return;
    s.messages = s.messages.slice(0, idx + 1);
    s.view.pop();
    speechSynthesis.cancel();
    runTurn(l, 'sonnet');
  }

  function setBusy(b) {
    document.getElementById('sendBtn').disabled = b;
    document.getElementById('mic').disabled = b;
  }

  // ---------- Handwriting pad ----------

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let drawing = false, hasInk = false;

  function sizeCanvas() {
    const r = canvas.getBoundingClientRect();
    if (!r.width) return;
    canvas.width = Math.round(r.width * 2);
    canvas.height = Math.round(r.height * 2);
    ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111';
    hasInk = false;
  }

  function togglePad() {
    const pad = document.getElementById('pad');
    pad.classList.toggle('open');
    if (pad.classList.contains('open')) sizeCanvas();
  }

  function pos(e) {
    const r = canvas.getBoundingClientRect();
    return [(e.clientX - r.left) * canvas.width / r.width, (e.clientY - r.top) * canvas.height / r.height];
  }

  canvas.addEventListener('pointerdown', e => {
    drawing = true; canvas.setPointerCapture(e.pointerId);
    const [x, y] = pos(e); ctx.beginPath(); ctx.moveTo(x, y);
  });
  canvas.addEventListener('pointermove', e => {
    if (!drawing) return;
    const [x, y] = pos(e); ctx.lineTo(x, y); ctx.stroke(); hasInk = true;
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => canvas.addEventListener(t, () => { drawing = false; }));

  function clearPad() { ctx.clearRect(0, 0, canvas.width, canvas.height); hasInk = false; }

  // Flatten onto white and return a data URL (the canvas is transparent by default).
  function padImage() {
    const c = document.createElement('canvas');
    c.width = canvas.width; c.height = canvas.height;
    const x = c.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
    x.drawImage(canvas, 0, 0);
    return c.toDataURL('image/png');
  }

  function sendDrawing() {
    if (!hasInk) { alert('Write something on the pad first.'); return; }
    if (document.getElementById('sendBtn').disabled) return;
    sendImage(padImage(), 'image/png');
    clearPad();
  }

  function sendPhoto(input) {
    const file = input.files && input.files[0];
    input.value = '';
    if (!file) return;
    const img = new Image();
    const reader = new FileReader();
    reader.onload = () => {
      img.onload = () => {
        // Shrink to max 1000px so the image stays cheap in tokens
        const scale = Math.min(1, 1000 / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        sendImage(c.toDataURL('image/jpeg', 0.8), 'image/jpeg');
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  function sendImage(dataUrl, mediaType) {
    const box = document.getElementById('input');
    const note = box.value.trim();
    box.value = '';
    const text = '[handwriting] ' + (note || 'Here is what I wrote. Please check it.');
    const s = state[lang()];
    s.messages.push({ role: 'user', content: [
      { type: 'image', source: { type: 'base64', media_type: mediaType, data: dataUrl.split(',')[1] } },
      { type: 'text', text: text }
    ]});
    s.view.push({ who: 'me', text: note || '✏️ Handwriting', img: dataUrl });
    runTurn(lang(), mode);
  }

  // ---------- Text-to-speech ----------

  function toggleSpeak() {
    speakOn = !speakOn;
    document.getElementById('spk').textContent = speakOn ? '🔊 On' : '🔇 Off';
    if (!speakOn) speechSynthesis.cancel();
  }

  function pickVoice(l) {
    const voices = speechSynthesis.getVoices();
    for (const p of voicePrefs(l)) {
      const v = voices.find(v => v.lang.replace('_', '-').startsWith(p));
      if (v) return v;
    }
    return null;
  }

  function speak(text, l, force) {
    if (!('speechSynthesis' in window)) return;
    if (!speakOn && !force) return;
    const parts = [...text.matchAll(/«([^»]+)»/g)].map(m => m[1].trim()).filter(Boolean);
    if (!parts.length) return;
    speechSynthesis.cancel();
    const voice = pickVoice(l);
    parts.forEach(p => {
      const u = new SpeechSynthesisUtterance(p);
      u.lang = speechOf(l);
      if (voice) u.voice = voice;
      u.rate = ({ zh: 0.75, es: 0.9, de: 0.85 }[l] || 0.9) * rateFactor; // slower for tones / long words
      speechSynthesis.speak(u);
    });
  }

  if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};

  // ---------- Microphone permission ----------

  let micReady = false;
  const FALLBACK = ' You can still speak: tap the 🎤 key on your phone keyboard while typing in the box.';

  function micBanner(text, showButton) {
    document.getElementById('micText').textContent = text;
    document.getElementById('micAllow').style.display = showButton ? '' : 'none';
    document.getElementById('micBanner').classList.add('show');
  }
  function hideMicBanner() { document.getElementById('micBanner').classList.remove('show'); }

  // The page is blocked from the mic entirely (e.g. the hosting frame doesn't allow it).
  function micBlockedByPage() {
    const fp = document.permissionsPolicy || document.featurePolicy;
    return !!(fp && fp.allowsFeature && !fp.allowsFeature('microphone'));
  }

  // Check on load and show the banner if permission hasn't been given yet.
  // ---------- 🎤 Mic test: shows exactly what works and what fails ----------
  function micTest() {
    closeProgress();
    let box = document.getElementById('progress');
    if (!box) { box = document.createElement('div'); box.id = 'progress'; document.body.appendChild(box); }
    box.style.display = 'block';
    const L = langInfo(lang()), code = speechOf(lang());
    const lines = [];
    const out = () => {
      box.innerHTML = '<div class="pcard"><div class="phead"><h3>🎤 Mic test</h3><button class="secondary" id="mtClose">✕</button></div>' +
        '<div class="mt">' + lines.map(x => '<div>' + x + '</div>').join('') + '</div>' +
        '<div class="pbtns"><button class="go" id="mtAgain">🎤 Test again</button></div>' +
        '<div class="sub" style="margin-top:8px">If something is ❌, send a screenshot of this box.</div></div>';
      box.querySelector('#mtClose').onclick = () => { if (t && t.r) try { t.r.abort(); } catch (e) {} closeProgress(); };
      box.querySelector('#mtAgain').onclick = micTest;
    };
    const t = {};
    lines.push((IS_PHONE ? '📱 Phone' : '💻 Computer') + ' · ' + escapeHtml((navigator.userAgent.match(/(Chrome|CriOS|Firefox|Edg|Safari)\/[\d.]+/) || ['unknown browser'])[0]) + ' · v' + APP_VERSION);
    lines.push(SR ? '✅ Speech recognition is available' : '❌ This browser has no speech recognition — use Chrome (or Edge on a computer)');
    lines.push(location.protocol === 'https:' ? '✅ Secure page (https)' : '❌ Not https — the mic only works on https pages');
    if (IS_PHONE && stripOn) lines.push('⚠ Pitch mode was ON (mic only drew pitch). Switched back to answering.');
    if (IS_PHONE && stripOn) { stripOn = false; showStrip(); idleMicHint(); }
    out();
    const perm = navigator.permissions && navigator.permissions.query ? navigator.permissions.query({ name: 'microphone' }).then(x => x.state).catch(() => 'unknown') : Promise.resolve('unknown');
    perm.then(st => {
      lines.push(st === 'granted' ? '✅ Microphone permission: allowed' : st === 'denied' ? '❌ Microphone permission: BLOCKED — tap 🔒 next to the address bar → Permissions → Microphone → Allow, then reload'
        : '⚠ Microphone permission: not decided yet (' + st + ') — the browser will ask; tap Allow');
      if (!SR) { out(); return; }
      lines.push('🗣 Now say a short sentence in ' + escapeHtml(L.name) + ' (listening for 6 seconds)…');
      lines.push('<span id="mtLive" class="sub">waiting for sound…</span>');
      out();
      speechSynthesis.cancel();
      const r = new SR(); t.r = r;
      r.lang = code; r.interimResults = true; r.continuous = true;
      let heard = '', audio = false, speech = false, err = '';
      r.onaudiostart = () => { audio = true; const e = document.getElementById('mtLive'); if (e) e.textContent = '🔴 mic is on — speak now'; };
      r.onspeechstart = () => { speech = true; };
      r.onresult = e => { heard = joinResults(e.results); const x = document.getElementById('mtLive'); if (x) x.textContent = '👂 ' + heard; };
      r.onerror = e => { err = e.error; };
      const stopT = setTimeout(() => { try { r.stop(); } catch (e) {} }, 6000);
      r.onend = () => {
        clearTimeout(stopT);
        lines.pop(); lines.pop();
        lines.push(audio ? '✅ The mic turned on' : '❌ The mic never turned on' + (err ? ' (' + err + ')' : ''));
        if (heard) lines.push('✅ Heard you: “' + escapeHtml(heard) + '” — the mic works for answers');
        else lines.push('❌ Nothing was recognised' + (err ? ' — error: <b>' + escapeHtml(err) + '</b>' : '') + '. ' + ({
          'not-allowed': 'The microphone is blocked for this site (see permission above).',
          'service-not-allowed': 'Speech recognition is turned off on this device/browser. Android: Settings → Apps → Google → enable “Speech Recognition and synthesis”; make sure the Google app is up to date.',
          'audio-capture': 'Another app or tab is using the microphone, or no mic is selected. Close other apps using the mic and try again.',
          'network': 'Speech recognition needs internet — check the connection.',
          'language-not-supported': L.name + ' recognition isn\'t installed. Android: Google app → Settings → Voice → Languages → add ' + L.name + '.',
          'no-speech': speech ? 'Sound was detected but not words — speak louder and closer.' : 'No speech detected — check the mic isn\'t muted and speak a bit louder.'
        }[err] || (audio ? 'Speak a little louder and closer to the phone.' : 'The browser did not start the mic.')));
        out();
      };
      try { r.start(); } catch (e) { lines.push('❌ Could not start: ' + escapeHtml(e.message)); out(); }
    });
  }

  async function checkMic() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      micBanner('This browser can\'t use the microphone here. Open the tutor link in Chrome.' + FALLBACK, false);
      return;
    }
    if (micBlockedByPage()) {
      micBanner('The microphone is blocked inside this window.' + FALLBACK, false);
      return;
    }
    try {
      const st = await navigator.permissions.query({ name: 'microphone' });
      const apply = () => {
        if (st.state === 'granted') { micReady = true; hideMicBanner(); }
        else if (st.state === 'denied') {
          micReady = false;
          micBanner('Microphone is turned off for this site. Tap the 🔒 icon next to the address bar → Permissions → Microphone → Allow, then reload.' + FALLBACK, false);
        } else { micReady = false; micBanner('🎤 Allow the microphone so you can answer out loud.', true); }
      };
      apply();
      st.onchange = apply;
    } catch (e) {
      // Permissions API not supported (some Safari versions): just offer the button.
      micBanner('🎤 Allow the microphone so you can answer out loud.', true);
    }
  }

  // Ask the browser for the mic. This makes Chrome show its "Allow" pop-up.
  async function requestMic() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      stream.getTracks().forEach(t => t.stop()); // we only needed the permission
      if (IS_PHONE) await new Promise(r => setTimeout(r, 400)); // phones need a moment to free the mic for recognition
      micReady = true;
      hideMicBanner();
      return true;
    } catch (e) {
      micReady = false;
      if (e.name === 'NotAllowedError' || e.name === 'SecurityError') {
        micBanner(micBlockedByPage()
          ? 'The microphone is blocked inside this window.' + FALLBACK
          : 'Microphone was not allowed. Tap the 🔒 icon next to the address bar → Permissions → Microphone → Allow, then reload.' + FALLBACK, false);
      } else if (e.name === 'NotFoundError') {
        micBanner('No microphone found on this device.' + FALLBACK, false);
      } else {
        micBanner('Couldn\'t start the microphone (' + e.name + ').' + FALLBACK, false);
      }
      return false;
    }
  }

  checkMic();

  // ---------- Speech-to-text ----------

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  // ---------- Listening ----------
  // Keeps listening through short thinking pauses, and only sends after the pause you choose
  // (⏱ menu next to the mic), or straight away when you tap ⏹.

  const NOTHING_HEARD_MS = 10000; // give up if you say nothing at all for this long
  var rec = null; // var (not let): read by start-up code that runs before this line

  function pauseSetting() {
    try { const s = localStorage.getItem('tutorPause'); if (s !== null) return s; } catch (e) {}
    return '3000';
  }

  function holdMode() { return pauseSetting() === 'hold'; }

  function pauseMs() {
    if (holdMode()) return 0;
    const v = Number(pauseSetting());
    return Number.isFinite(v) ? v : 3000;
  }

  function onPauseChange() {
    const v = document.getElementById('pause').value;
    try { localStorage.setItem('tutorPause', v); } catch (e) {}
    idleMicHint();
  }

  function idleMicHint() {
    if (rec) return;
    document.getElementById('input').placeholder = IS_PHONE && stripOn ? '〰 Pitch mode: tap 🎤' : holdMode() ? 'Type, or hold 🎤 to speak' : 'Type, or tap 🎤 to speak';
    document.getElementById('mic').title = holdMode() ? 'Hold to talk, release to send' : 'Tap to talk';
  }

  // Tap mode: a click starts / stops. Hold mode: press starts, release sends.
  var holding = false;
  (function wireMic() {
    const b = document.getElementById('mic');
    b.addEventListener('click', () => { if (IS_PHONE && stripOn) { phonePitchMic(); return; } if (!holdMode()) listen(false); });
    b.addEventListener('pointerdown', e => {
      if (!holdMode() || b.disabled) return;
      e.preventDefault();
      try { b.setPointerCapture(e.pointerId); } catch (x) {}
      holding = true;
      listen(true);
    });
    const release = () => {
      if (!holding) return;
      holding = false;
      if (rec) rec.stopNow();
    };
    b.addEventListener('pointerup', release);
    b.addEventListener('pointercancel', release);
    b.addEventListener('contextmenu', e => e.preventDefault());
  })();

  // Joins recognition results. Some Android phones repeat the whole phrase in every result,
  // so a result that already contains the text so far replaces it instead of being added.
  function joinResults(results) {
    let out = '';
    for (let i = 0; i < results.length; i++) {
      const t = String(results[i][0].transcript || '').trim();
      if (!t) continue;
      const a = out.toLowerCase(), b = t.toLowerCase();
      if (out && b.startsWith(a)) out = t;
      else if (out && a.endsWith(b)) continue;
      else out = out ? out + ' ' + t : t;
    }
    return out;
  }

  async function listen(hold) {
    if (IS_PHONE && stripOn) return; // phone pitch mode: the click handler runs the pitch-only mic
    if (rec) { if (!hold) rec.stopNow(); return; } // tap ⏹ = send now
    if (!SR) {
      alert('Speech recognition is not available in this browser. Use Chrome, or the mic key on your phone keyboard.');
      return;
    }
    if (!micReady) {
      const ok = await requestMic(); // first use asks for permission automatically
      if (!ok) return;
      if (hold) { holding = false; document.getElementById('input').placeholder = 'Microphone allowed — now hold 🎤 while you speak'; return; }
    }
    if (hold && !holding) return; // released before listening could start
    speechSynthesis.cancel();

    const mic = document.getElementById('mic');
    const box = document.getElementById('input');
    const wait = pauseMs();               // 0 = only send when ⏹ is tapped
    const asking = askNext;
    const oldPlaceholder = box.placeholder;
    let committed = '', current = '', gotResult = false, stopping = false, done = false;
    let timer = null, restarts = 0, r = null;

    const text = () => (committed + ' ' + current).trim();
    const show = () => { box.value = text(); };

    const armTimer = () => {
      clearTimeout(timer);
      if (wait > 0) timer = setTimeout(stopNow, wait);
    };

    function stopNow() {
      stopping = true;
      clearTimeout(timer);
      try { r.stop(); } catch (e) { finish(); }
    }

    function finish() {
      if (done) return;
      done = true;
      clearTimeout(timer);
      rec = null;
      pitch.want = false; pitchStop(); stripCaption(); drawStrip();
      mic.classList.remove('listening');
      mic.textContent = '🎤';
      box.placeholder = oldPlaceholder;
      idleMicHint();
      const t = gotResult ? text() : '';
      if (hold && !t) { box.placeholder = IS_PHONE ? 'Didn\'t catch it — hold 🎤' : 'Didn\'t catch anything — keep holding 🎤 while you speak'; toast('🎤 Didn\'t catch that — keep holding 🎤 until you finish speaking.'); }
      if (gotResult) box.value = '';
      if (t) sendText('[voice] ' + t);
    }

    function begin() {
      r = new SR();
      r.lang = asking ? helpSpeech() : speechOf(lang()); // questions are asked in your explanation language
      r.interimResults = true;  // show words as you speak
      r.continuous = true;      // don't stop at the first pause
      r.maxAlternatives = 1;

      r.onresult = e => {
        gotResult = true;
        current = joinResults(e.results);
        show();
        armTimer();             // the pause countdown restarts every time you speak
      };
      r.onerror = e => {
        if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
          micReady = false;
          stopping = true;
          checkMic();
          return;
        }
        if (e.error === 'aborted') return;
        if (e.error === 'no-speech' && gotResult) return; // just a long pause: keep going
        stopping = true;
        if (!gotResult) {
          const msg = e.error === 'no-speech'
            ? 'Didn\'t hear anything. Tap 🎤 and speak when you\'re ready.'
            : 'Didn\'t catch that (' + e.error + '). Try again.';
          state[lang()].view.push({ who: 'err', text: msg });
          render();
        }
      };
      // Browsers end listening by themselves now and then; restart quietly unless we meant to stop.
      r.onend = () => {
        committed = text();
        current = '';
        if (!stopping && !done && restarts < 30) {
          restarts += 1;
          try { begin(); return; } catch (e) {}
        }
        finish();
      };
      r.start();
    }

    rec = { stopNow: stopNow };
    if (stripOn && !IS_PHONE) { pitch.want = true; pitch.last = null; pitchStart(); }
    mic.classList.add('listening');
    mic.textContent = hold ? '🔴' : '⏹';
    box.placeholder = hold ? 'Listening… release to send' : wait > 0
      ? 'Listening… pause ' + (wait / 1000) + 's or tap ⏹ to send'
      : 'Listening… tap ⏹ when you finish';
    begin();
    clearTimeout(timer);
    if (!hold) timer = setTimeout(() => { if (!gotResult) stopNow(); }, NOTHING_HEARD_MS);
  }
</script>
</body>
</html>
